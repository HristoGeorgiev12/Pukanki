name: Build Pukanki Mobile APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-mobile/**'
      - '.github/workflows/build-mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build Mobile APK with Gradle
        run: |
          export PATH="$PWD/gradle-8.4/bin:$PATH"
          export BUILD_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          TASK="assembleDebug"
          if [ -n "$PUKANKI_KEYSTORE_BASE64" ] && [ -n "$PUKANKI_KEYSTORE_PASSWORD" ]; then
            echo "$PUKANKI_KEYSTORE_BASE64" | base64 --decode > "$PWD/pukanki-release.p12"
            export PUKANKI_KEYSTORE_PATH="$PWD/pukanki-release.p12"
            TASK="assembleRelease"
            echo "Building signed Release Mobile APK (versionCode=$BUILD_VERSION_CODE)"
          else
            echo "No release keystore secret found; building Debug Mobile APK (versionCode=$BUILD_VERSION_CODE)"
          fi
          cd android-mobile
          gradle $TASK --stacktrace --no-daemon > ../gradle_mobile_build.log 2>&1 || {
            tail -n 120 ../gradle_mobile_build.log
            exit 1
          }
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          PUKANKI_KEYSTORE_BASE64: ${{ secrets.PUKANKI_KEYSTORE_BASE64 }}
          PUKANKI_KEYSTORE_PASSWORD: ${{ secrets.PUKANKI_KEYSTORE_PASSWORD }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-mobile-build-log
          path: gradle_mobile_build.log

      - name: Copy & Prepare Mobile APK
        run: |
          mkdir -p output-mobile
          find android-mobile/app/build/outputs/apk -name "*.apk" -exec cp {} output-mobile/Pukanki-Mobile.apk \;
          ls -lh output-mobile/

      - name: Upload Mobile APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pukanki-Mobile-APK
          path: output-mobile/Pukanki-Mobile.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.0.1
          name: Pukanki Mobile v1.0.1 (Zero-Ad VOE + 7 Sorts + All Website Filters)
          body: |
            ### 🍿 Пуканки Mobile v1.0.0 (Android приложение за телефон)

            - **100% нативен вертикален интерфейс за телефон** с 3 колони постери и сензорно управление.
            - **Всички филтри от сайта:** Сортиране, Включване/Изключване на жанрове, Година (от–до), Времетраене, Конкретен плеър и Търсене.
            - **Нативен ExoPlayer без реклами:** VOE, Vidon, Streamtape, OK.ru, Filemoon + бутон **📺 Cast** за препращане към телевизор.
          files: output-mobile/Pukanki-Mobile.apk
