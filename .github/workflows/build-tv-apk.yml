name: Build Android TV APK

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build APK with Gradle
        run: |
          export PATH="$PWD/gradle-8.4/bin:$PATH"
          cd android-tv
          gradle assembleDebug --stacktrace --info > ../gradle_build.log 2>&1 || {
            tail -n 80 ../gradle_build.log
            exit 1
          }
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Copy & Prepare APK
        run: |
          mkdir -p output
          find android-tv/app/build/outputs/apk -name "*.apk" -exec cp {} output/Pukanki-TV.apk \;
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pukanki-TV-APK
          path: output/Pukanki-TV.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: tv-v1.0.1
          name: Pukanki TV v1.0.1 APK
          body: |
            ### 🍿 Пуканки TV App v1.0.1 за Google TV & Android TV
            
            - **Системен клик с дистанционното:** Бутонът `▶ Пусни плеъра` вече докосва директно центъра на видеото (работи на Streamtape, Filemoon, Uqload и др.).
            - **Пълен HTML5 екран:** Поддръжка за вградения цял екран в плеърите и чисто връщане с бутона Назад.
            - **Защита от рекламни пренасочвания:** Блокира изскачащи прозорци и външни редиректи извън приложението.
            - Автоматично обновяване от Vercel.
            
            **Директен линк за сваляне в Downloader:**
            `https://github.com/HristoGeorgiev12/Pukanki/releases/download/tv-v1.0.1/Pukanki-TV.apk`
          files: output/Pukanki-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
