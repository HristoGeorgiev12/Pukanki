name: Build Android TV APK

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          cd android-tv
          gradle assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Copy & Prepare APK
        run: |
          mkdir -p output
          find android-tv/app/build/outputs/apk -name "*.apk" -exec cp {} output/Pukanki-TV.apk \;
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pukanki-TV-APK
          path: output/Pukanki-TV.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: tv-v1.0.0
          name: Pukanki TV v1.0.0 APK
          body: |
            ### 🍿 Пуканки TV App за Google TV & Android TV
            
            - Оптимизирано за управление само със стрелките на дистанционното (D-Pad).
            - Директен пълен екран без браузърни ленти.
            - Зарежда автоматично актуалната версия на сайта.
            
            **Директен линк за сваляне в Downloader:**
            `https://github.com/HristoGeorgiev12/Pukanki/releases/download/tv-v1.0.0/Pukanki-TV.apk`
          files: output/Pukanki-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
