name: Build Android TV APK

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle Wrapper
        run: |
          cd android-tv
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android-tv
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp android-tv/app/build/outputs/apk/debug/*.apk output/Pukanki-TV.apk
          ls -la output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pukanki-TV-APK
          path: output/Pukanki-TV.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: tv-v1.0.0
          name: Pukanki TV v1.0.0 APK
          body: |
            ### 🍿 Пуканки TV App за Android TV & Google TV
            
            - **Лесно управление с дистанционно (D-Pad)**: стрелки и OK бутон без мишка.
            - **Истински пълен екран (Leanback)**.
            - **Автоматично обновяване**: зарежда сайта директно от Vercel.
            
            **Директен линк за сваляне в Downloader**:
            `https://github.com/HristoGeorgiev12/Pukanki/releases/download/tv-v1.0.0/Pukanki-TV.apk`
          files: output/Pukanki-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
