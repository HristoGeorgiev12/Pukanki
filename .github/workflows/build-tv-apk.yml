name: Build Android TV APK

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build APK with Gradle
        run: |
          export PATH="$PWD/gradle-8.4/bin:$PATH"
          cd android-tv
          gradle assembleDebug --stacktrace --no-daemon > ../gradle_build.log 2>&1 || {
            tail -n 120 ../gradle_build.log
            exit 1
          }
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Copy & Prepare APK
        run: |
          mkdir -p output
          find android-tv/app/build/outputs/apk -name "*.apk" -exec cp {} output/Pukanki-TV.apk \;
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pukanki-TV-APK
          path: output/Pukanki-TV.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: tv-v2.0.5
          name: Pukanki TV v2.0.5 (Full Website Filters + Sort Panel + Zero-Ad VOE)
          body: |
            ### 🍿 Пуканки TV v2.0.0 (Нативно Android TV приложение + ExoPlayer)
            
            - **100% нативен Android TV интерфейс:** 6 компактни постера на ред, 60 FPS навигация, без WebView лаг.
            - **Бърз сървърен каталог (`/api/catalog`):** Зарежда само по 30 филма на страница (~15 KB вместо 85 MB).
            - **Google Media3 ExoPlayer:** Пауза (`OK`), превъртане напред/назад (`◀ ▶` ±15 сек), цял екран и смяна на плеъра (`▲`).
            - Сайтът и мобилната версия са напълно недокоснати.
            
            **Директен линк за сваляне в Downloader:**
            `https://github.com/HristoGeorgiev12/Pukanki/releases/download/tv-v2.0.0/Pukanki-TV.apk`
          files: output/Pukanki-TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
