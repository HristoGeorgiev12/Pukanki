name: Build Android TV APK

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          echo "$PWD/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build APK with Gradle
        run: |
          export PATH="$PWD/gradle-8.4/bin:$PATH"
          export BUILD_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          TASK="assembleDebug"
          if [ -n "$PUKANKI_KEYSTORE_BASE64" ] && [ -n "$PUKANKI_KEYSTORE_PASSWORD" ]; then
            echo "$PUKANKI_KEYSTORE_BASE64" | base64 --decode > "$PWD/pukanki-release.p12"
            export PUKANKI_KEYSTORE_PATH="$PWD/pukanki-release.p12"
            TASK="assembleRelease"
            echo "Building signed Release APK (versionCode=$BUILD_VERSION_CODE)"
          else
            echo "No release keystore secret found; building Debug APK (versionCode=$BUILD_VERSION_CODE)"
          fi
          cd android-tv
          gradle $TASK --stacktrace --no-daemon > ../gradle_build.log 2>&1 || {
            tail -n 120 ../gradle_build.log
            exit 1
          }
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          PUKANKI_KEYSTORE_BASE64: ${{ secrets.PUKANKI_KEYSTORE_BASE64 }}
          PUKANKI_KEYSTORE_PASSWORD: ${{ secrets.PUKANKI_KEYSTORE_PASSWORD }}

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_build.log

      - name: Copy & Prepare APK
        run: |
          mkdir -p output
          find android-tv/app/build/outputs/apk -name "*.apk" -exec cp {} output/Pukanki-TV-v2.4.0.apk \;
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pukanki-TV-v2.4.0-APK
          path: output/Pukanki-TV-v2.4.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: tv-v2.4.0
          name: Pukanki TV v2.4.0 (Per-Profile Favorites & Watch Later Tabs)
          body: |
            ### 🍿 Пуканки TV v2.4.0 (Любими + За по-късно за всеки профил)
            
            - **❤️ Любими и 🔖 За по-късно:** отделни бутони в детайлите на всеки филм и отделни табове в лявото меню с бройка, изолирани за всеки локален профил.
          files: output/Pukanki-TV-v2.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
