            const shouldShow = state.typeFilter === "unique" || state.uniqueOnly;
            uniqueSitesBar.style.display = shouldShow ? "flex" : "none";
            if (!shouldShow) {
                return;
            }

            const siteList = ["all", "Filmi9", "ZenoPlay", "Filmifen", "Filmizip", "Filmi2k"];
            let html = "";
            let totalUnique = 0;
            for (const count of uniqueBySite.values()) {
                totalUnique += count;
            }

            for (const site of siteList) {
                const label = site === "all" ? "Всички сайтове" : site;
                const count = site === "all" ? totalUnique : (uniqueBySite.get(site) || 0);
                const isCur = (!state.uniqueSiteFilter && site === "all") || (state.uniqueSiteFilter === site);
                const activeCls = isCur ? "active" : "";
                html = `${html}<button type="button" class="unique-site-btn ${activeCls}" data-site="${site}">${label} <span class="tab-count">${count}</span></button>`;
            }
            uniqueSitesBar.innerHTML = html;
        }

        function renderGenreBadges() {
            const isAllNeutral = state.selectedGenres.size === 0 && state.excludedGenres.size === 0;
            const allActiveClass = isAllNeutral ? "active" : "";
            let badgesHtml = `<button type="button" class="genre-filter-badge ${allActiveClass}" data-genre="__ALL__">Всички</button>`;

            let availableGenres = null;
            if (!isAllNeutral) {
                availableGenres = new Set();
                for (const item of state.items) {
                    if (!matchesTypeTab(item) || !matchesSelectedGenres(item)) {
                        continue;
                    }
                    const itemGenres = Array.isArray(item.genres) ? item.genres : [];
                    for (const g of itemGenres) {
                        availableGenres.add(g);
                    }
                }
            }

            for (const genre of state.allGenres) {
                const isSelected = state.selectedGenres.has(genre);
                const isExcluded = state.excludedGenres.has(genre);
                const safeGenre = escapeHtml(genre);

                if (!isSelected && !isExcluded && availableGenres && !availableGenres.has(genre)) {
                    continue;
                }

                if (isSelected) {
                    badgesHtml = `${badgesHtml}<button type="button" class="genre-filter-badge active" data-genre="${safeGenre}">+ ${safeGenre}</button>`;
                    continue;
                }

                if (isExcluded) {
                    badgesHtml = `${badgesHtml}<button type="button" class="genre-filter-badge excluded" data-genre="${safeGenre}">✕ ${safeGenre}</button>`;
                    continue;
                }

                badgesHtml = `${badgesHtml}<button type="button" class="genre-filter-badge" data-genre="${safeGenre}">${safeGenre}</button>`;
            }

            genreBadgesBar.innerHTML = badgesHtml;

            const totalActiveGenres = state.selectedGenres.size + state.excludedGenres.size;
            if (genreToggleBadge && toggleGenresBtn) {
                if (totalActiveGenres > 0) {
                    genreToggleBadge.textContent = `${totalActiveGenres}`;
                    genreToggleBadge.style.display = "inline-block";
                    toggleGenresBtn.classList.add("has-active");
                } else {
                    genreToggleBadge.style.display = "none";
                    toggleGenresBtn.classList.remove("has-active");
                }
            }
        }

        function populateFilterOptions(items) {
            const genreSet = new Set();
            const yearSet = new Set();
            const playerCounts = new Map();
            const sourceCounts = new Map();

            for (const item of items) {
                const genres = Array.isArray(item.genres) ? item.genres : [];
                for (const genre of genres) {
                    if (genre && `${genre}`.trim().toLowerCase() !== "бг аудио") {
                        genreSet.add(genre);
                    }
                }
                if (item.year) {
                    yearSet.add(item.year);
                }
                const pNames = getItemPlayerNames(item);
                for (const pName of pNames) {
                    const prev = playerCounts.get(pName) ?? 0;
                    playerCounts.set(pName, prev + 1);
                }
                const origins = Array.isArray(item.origins) && item.origins.length > 0 ? item.origins : ["ZenoPlay"];
                for (const orig of origins) {
                    const prev = sourceCounts.get(orig) ?? 0;
                    sourceCounts.set(orig, prev + 1);
                }
            }

            state.allGenres = Array.from(genreSet).sort((a, b) => a.localeCompare(b, "bg"));
            renderGenreBadges();

            const curYearFrom = yearFromSelect.value;
            const curYearTo = yearToSelect.value;
            const curPlayer = playerSelect.value;
            const curSource = sourceSelect.value;

            const sortedYears = Array.from(yearSet).sort((a, b) => Number(b) - Number(a));
            let yearFromHtml = `<option value="">От година</option>`;
            let yearToHtml = `<option value="">До година</option>`;
            for (const year of sortedYears) {
                yearFromHtml = `${yearFromHtml}<option value="${year}">От ${year}</option>`;
                yearToHtml = `${yearToHtml}<option value="${year}">До ${year}</option>`;
            }
            yearFromSelect.innerHTML = yearFromHtml;
            yearToSelect.innerHTML = yearToHtml;
            if (curYearFrom) {
                yearFromSelect.value = curYearFrom;
            }
            if (curYearTo) {
                yearToSelect.value = curYearTo;
            }

            const playerNames = Array.from(playerCounts.keys()).sort((a, b) => {
                const aIsBg = a.startsWith("🇧🇬") || a === "BG Player";
                const bIsBg = b.startsWith("🇧🇬") || b === "BG Player";
                if (aIsBg && !bIsBg) {
                    return -1;
                }
                if (!aIsBg && bIsBg) {
                    return 1;
                }
                return (playerCounts.get(b) ?? 0) - (playerCounts.get(a) ?? 0);
            });

            let playerOptionsHtml = `<option value="">Всички плеъри</option>`;
            for (const pName of playerNames) {
                const count = playerCounts.get(pName) ?? 0;
                const safeP = escapeHtml(pName);
                const castMarker = isCastPlayer(pName) ? " 📺" : "";
                playerOptionsHtml = `${playerOptionsHtml}<option value="${safeP}">${safeP}${castMarker} (${count})</option>`;
            }
            playerSelect.innerHTML = playerOptionsHtml;
            if (curPlayer) {
                playerSelect.value = curPlayer;
            }

            const sourceNames = ["Filmi9", "ZenoPlay", "Filmifen", "Filmizip", "Filmi2k"];
            let sourceOptionsHtml = `<option value="">Всички източници</option>`;
            for (const sName of sourceNames) {
                const count = sourceCounts.get(sName) ?? 0;
                sourceOptionsHtml = `${sourceOptionsHtml}<option value="${sName}">${sName} (${count})</option>`;
            }
            sourceSelect.innerHTML = sourceOptionsHtml;
            if (curSource) {
                sourceSelect.value = curSource;
            }
        }

        function itemHasCastPlayer(item) {
            const pNames = getItemPlayerNames(item);
            for (const p of pNames) {
                if (isCastPlayer(p)) {
                    return true;
                }
            }
            return false;
        }

        function matchesSelectedSource(item, selectedSource, uniqueOnly) {
            const origins = Array.isArray(item.origins) && item.origins.length > 0 ? item.origins : ["ZenoPlay"];
            if (uniqueOnly || state.uniqueOnly) {
                if (origins.length !== 1) {
                    return false;
                }
                if (selectedSource && origins[0] !== selectedSource) {
                    return false;
                }
                return true;
            }
            if (!selectedSource) {
                return true;
            }
            return origins.includes(selectedSource);
        }

        function matchesMovieQuery(item, query) {
            if (!query) {
                return true;
            }

            const raw = query.trim();
            if (!raw || raw === "#" || raw === "@" || ((raw.startsWith("#") || raw.startsWith("@")) && !raw.includes(" ") && !raw.includes(":"))) {
                return true;
            }

            const plotMatch = raw.match(/^[#@](?:сюжет|overview|plot)[:\s]+(.*)$/i);
            if (plotMatch) {
                const targetText = plotMatch[1].trim().toLowerCase();
                if (!targetText) {
                    return true;
                }
                const overviewText = `${item.overview ?? ""}`.toLowerCase();
                return overviewText.includes(targetText);
            }

            const actorMatch = raw.match(/^[#@](?:актьор|актьори|actor|actors)[:\s]+(.*)$/i);
            if (actorMatch) {
                const targetText = actorMatch[1].trim().toLowerCase();
                if (!targetText) {
                    return true;
                }
                const actors = Array.isArray(item.actors) ? item.actors : [];
                for (const actor of actors) {
                    if (`${actor}`.toLowerCase().includes(targetText)) {
                        return true;
                    }
                }
                const tags = Array.isArray(item.tags) ? item.tags : [];
                for (const tag of tags) {
                    if (`${tag}`.toLowerCase().includes(targetText)) {
                        return true;
                    }
                }
                return false;
            }

            const directorMatch = raw.match(/^[#@](?:режисьор|режисьори|director|directors)[:\s]+(.*)$/i);
            if (directorMatch) {
                const targetText = directorMatch[1].trim().toLowerCase();
                if (!targetText) {
                    return true;
                }
                const directors = Array.isArray(item.directors) ? item.directors : [];
                for (const director of directors) {
                    if (`${director}`.toLowerCase().includes(targetText)) {
                        return true;
                    }
                }
                return false;
            }

            const countryMatch = raw.match(/^[#@](?:държава|country)[:\s]+(.*)$/i);
            if (countryMatch) {
                const targetText = countryMatch[1].trim().toLowerCase();
                if (!targetText) {
                    return true;
                }
                const countries = Array.isArray(item.countries) ? item.countries : [];
                for (const country of countries) {
                    if (`${country}`.toLowerCase().includes(targetText)) {
                        return true;
                    }
                }
                return false;
            }

            const idMatch = raw.match(/^[#@](?:id|tmdb)[:\s]+(.*)$/i);
            if (idMatch) {
                const targetText = idMatch[1].trim().toLowerCase();
                if (!targetText) {
                    return true;
                }
                return `${item.tmdb_id ?? ""}`.toLowerCase().includes(targetText);
            }

            const durMatch = raw.match(/^[#@](?:времетраене|време|duration|runtime)[:\s]+(.*)$/i);
            if (durMatch) {
                const targetText = durMatch[1].trim();
                if (!targetText) {
                    return true;
                }
                const dur = Number(item.duration_minutes ?? 0);
                if (!dur) {
                    return false;
                }
                if (targetText.startsWith(">")) {
                    return dur > Number(targetText.slice(1).trim());
                }
                if (targetText.startsWith("<")) {
                    return dur < Number(targetText.slice(1).trim());
                }
                const num = Number(targetText);
                if (num) {
                    return Math.abs(dur - num) <= 15;
                }
                return true;
            }

            const cleanQuery = raw.toLowerCase();
            const titleText = `${item.title ?? ""}`.toLowerCase();
            if (titleText.includes(cleanQuery)) {
                return true;
            }

            const origTitleText = `${item.original_title ?? ""}`.toLowerCase();
            if (origTitleText.includes(cleanQuery)) {
                return true;
            }

            const slugText = `${item.slug ?? ""}`.toLowerCase();
            if (slugText.includes(cleanQuery)) {
                return true;
            }

            if (Array.isArray(item.actors)) {
                for (const actor of item.actors) {
                    if (`${actor}`.toLowerCase().includes(cleanQuery)) {
                        return true;
                    }
                }
            }

            if (Array.isArray(item.directors)) {
                for (const director of item.directors) {
                    if (`${director}`.toLowerCase().includes(cleanQuery)) {
                        return true;
                    }
                }
            }

            return false;
        }

        function sortMoviesList(list, sortMode) {
            const sorted = [...list];
            if (sortMode === "rating_desc") {
                return sorted.sort((a, b) => Number(b.rating ?? 0) - Number(a.rating ?? 0));
            }
            if (sortMode === "year_desc") {
                return sorted.sort((a, b) => Number(b.year ?? 0) - Number(a.year ?? 0));
            }
            if (sortMode === "year_asc") {
                return sorted.sort((a, b) => Number(a.year ?? 0) - Number(b.year ?? 0));
            }
            if (sortMode === "duration_desc") {
                return sorted.sort((a, b) => Number(b.duration_minutes ?? b.seasons_count ?? 0) - Number(a.duration_minutes ?? a.seasons_count ?? 0));
            }
            if (sortMode === "title_asc") {
                return sorted.sort((a, b) => `${a.title ?? ""}`.localeCompare(`${b.title ?? ""}`, "bg"));
            }
            return sorted;
        }

        function matchesSelectedGenres(item) {
            const itemGenres = Array.isArray(item.genres) ? item.genres : [];

            for (const excluded of state.excludedGenres) {
                if (itemGenres.includes(excluded)) {
                    return false;
                }
            }

            for (const selected of state.selectedGenres) {
                if (!itemGenres.includes(selected)) {
                    return false;
                }
            }

            return true;
        }

        function matchesTypeTab(item) {
            if (state.typeFilter === "movie") {
                return item.type !== "tv";
            }
            if (state.typeFilter === "tv") {
                return item.type === "tv";
            }
            if (state.typeFilter === "filmi9") {
                return Array.isArray(item.origins) && item.origins.includes("Filmi9");
            }
            if (state.typeFilter === "unique") {
                const origins = Array.isArray(item.origins) && item.origins.length > 0 ? item.origins : ["ZenoPlay"];
                if (origins.length !== 1) {
                    return false;
                }
                if (state.uniqueSiteFilter && origins[0] !== state.uniqueSiteFilter) {
                    return false;
                }
                return true;
            }
            if (state.typeFilter === "watchlist") {
                return isInWatchlist(item);
            }
            return true;
        }

        function matchesYearPeriod(item, fromVal, toVal) {
            if (!fromVal && !toVal) {
                return true;
            }
            const itemYear = Number(item.year ?? 0);
            if (!itemYear) {
                return false;
            }
            const yFrom = fromVal ? Number(fromVal) : 0;
            const yTo = toVal ? Number(toVal) : 0;
            if (yFrom && yTo) {
                const minYear = Math.min(yFrom, yTo);
                const maxYear = Math.max(yFrom, yTo);
                return itemYear >= minYear && itemYear <= maxYear;
            }
            if (yFrom) {
                return itemYear >= yFrom;
            }
            return itemYear <= yTo;
        }

        function matchesDuration(item, durationVal) {
            if (!durationVal) {
                return true;
            }
            if (durationVal === "tv-mini") {
                return isMiniSeries(item);
            }
            if (durationVal === "tv-short") {
                return item.type === "tv" && getItemSeasonsCount(item) <= 2;
            }
            if (durationVal === "tv-long") {
                return item.type === "tv" && getItemSeasonsCount(item) >= 3;
            }

            const dur = Number(item.duration_minutes ?? 0);
            if (!dur) {
                return false;
            }
            if (durationVal === "0-90") {
                return dur < 90;
            }
            if (durationVal === "90-120") {
                return dur >= 90 && dur <= 120;
            }
            if (durationVal === "120-150") {
                return dur > 120 && dur <= 150;
            }
            if (durationVal === "150+") {
                return dur > 150;
            }
            return true;
        }

        function matchesSelectedPlayer(item, selectedPlayer) {
            if (!selectedPlayer) {
                return true;
            }
            const names = getItemPlayerNames(item);
            return names.includes(selectedPlayer);
        }

        function matchesGenresWithOverride(item, ignoredGenre, ignoreAllGenres) {
            if (ignoreAllGenres) {
                return true;
            }
            const itemGenres = Array.isArray(item.genres) ? item.genres : [];

            for (const excluded of state.excludedGenres) {
                if (excluded === ignoredGenre) {
                    continue;
                }
                if (itemGenres.includes(excluded)) {
                    return false;
                }
            }

            for (const selected of state.selectedGenres) {
                if (selected === ignoredGenre) {
                    continue;
                }
                if (!itemGenres.includes(selected)) {
                    return false;
                }
            }

            return true;
        }

        function hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, overrides) {
            const effQuery = overrides.ignoreQuery ? "" : query;
            const effYearFrom = overrides.ignoreYearFrom ? "" : yearFrom;
            const effYearTo = overrides.ignoreYearTo ? "" : yearTo;
            const effDuration = overrides.ignoreDuration ? "" : selectedDuration;
            const effPlayer = overrides.ignorePlayer ? "" : selectedPlayer;
            const effSource = overrides.ignoreSource ? "" : selectedSource;

            for (const item of state.items) {
                if (!overrides.ignoreType && !matchesTypeTab(item)) {
                    continue;
                }
                if (!overrides.ignoreAudioSub) {
                    if (state.audioSubFilter === "bg-audio" && !hasBgSource(item)) {
                        continue;
                    }
                    if (state.audioSubFilter === "sub" && !hasSubtitles(item)) {
                        continue;
                    }
                }
                if (!matchesMovieQuery(item, effQuery)) {
                    continue;
                }
                if (!matchesGenresWithOverride(item, overrides.ignoreGenre, overrides.ignoreAllGenres)) {
                    continue;
                }
                if (!matchesYearPeriod(item, effYearFrom, effYearTo)) {
                    continue;
                }
                if (!matchesDuration(item, effDuration)) {
                    continue;
                }
                if (!matchesSelectedPlayer(item, effPlayer)) {
                    continue;
                }
                if (!matchesSelectedSource(item, effSource)) {
                    continue;
                }
                return true;
            }
            return false;
        }

        function clearFilterCulprits() {
            const currentCulprits = document.querySelectorAll(".filter-culprit");
            for (const el of currentCulprits) {
                el.classList.remove("filter-culprit");
            }
            state.culpritReasons = [];
        }

        function updateZeroResultFilterDiagnostics(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource) {
            clearFilterCulprits();
            if (state.filtered.length > 0 || state.items.length === 0) {
                return;
            }

            const reasons = [];

            if (query && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreQuery: true })) {
                searchInput.classList.add("filter-culprit");
                reasons.push(`Търсене („${searchInput.value.trim()}“)`);
            }

            let yearCulpritFound = false;
            if (yearFrom && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreYearFrom: true })) {
                yearFromSelect.classList.add("filter-culprit");
                reasons.push(`От година (${yearFrom})`);
                yearCulpritFound = true;
            }
            if (yearTo && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreYearTo: true })) {
                yearToSelect.classList.add("filter-culprit");
                reasons.push(`До година (${yearTo})`);
                yearCulpritFound = true;
            }
            if (!yearCulpritFound && (yearFrom || yearTo) && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreYearFrom: true, ignoreYearTo: true })) {
                if (yearFrom) {
                    yearFromSelect.classList.add("filter-culprit");
                }
                if (yearTo) {
                    yearToSelect.classList.add("filter-culprit");
                }
                reasons.push("Избран период от години");
            }

            if (selectedDuration && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreDuration: true })) {
                if (durationSelect) {
                    durationSelect.classList.add("filter-culprit");
                }
                const durText = durationSelect?.options[durationSelect.selectedIndex]?.text ?? selectedDuration;
                reasons.push(`Времетраене (${durText})`);
            }

            if (selectedPlayer && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignorePlayer: true })) {
                playerSelect.classList.add("filter-culprit");
                reasons.push(`Плеър (${selectedPlayer})`);
            }

            if (selectedSource && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreSource: true })) {
                sourceSelect.classList.add("filter-culprit");
                reasons.push(`Източник (${selectedSource})`);
            }

            let genreCulpritFound = false;
            const allBadgeEls = genreBadgesBar.querySelectorAll(".genre-filter-badge");
            for (const genre of state.selectedGenres) {
                if (hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreGenre: genre })) {
                    for (const b of allBadgeEls) {
                        if (b.dataset.genre === genre) {
                            b.classList.add("filter-culprit");
                        }
                    }
                    reasons.push(`Жанр (+ ${genre})`);
                    genreCulpritFound = true;
                }
            }
            for (const genre of state.excludedGenres) {
                if (hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreGenre: genre })) {
                    for (const b of allBadgeEls) {
                        if (b.dataset.genre === genre) {
                            b.classList.add("filter-culprit");
                        }
                    }
                    reasons.push(`Изключен жанр (✕ ${genre})`);
                    genreCulpritFound = true;
                }
            }
            const hasActiveGenres = state.selectedGenres.size > 0 || state.excludedGenres.size > 0;
            if (!genreCulpritFound && hasActiveGenres && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreAllGenres: true })) {
                for (const b of allBadgeEls) {
                    if (state.selectedGenres.has(b.dataset.genre) || state.excludedGenres.has(b.dataset.genre)) {
                        b.classList.add("filter-culprit");
                    }
                }
                reasons.push("Комбинация от жанрове");
            }

            if (state.typeFilter !== "all" && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreType: true })) {
                const activeTabBtn = typeTabsBar.querySelector(".type-tab-btn.active");
                if (activeTabBtn) {
                    activeTabBtn.classList.add("filter-culprit");
                }
                reasons.push("Избран таб");
            }

            if (state.audioSubFilter && hasAnyMatchWithOverrides(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource, { ignoreAudioSub: true })) {
                if (audioSubFilterSelect) {
                    audioSubFilterSelect.classList.add("filter-culprit");
                }
                const label = state.audioSubFilter === "bg-audio" ? "БГ Аудио" : "БГ Субс";
                reasons.push(label);
            }

            if (reasons.length === 0) {
                if (query) {
                    searchInput.classList.add("filter-culprit");
                    reasons.push(`Търсене („${searchInput.value.trim()}“)`);
                }
                if (yearFrom) {
                    yearFromSelect.classList.add("filter-culprit");
                    reasons.push(`От година (${yearFrom})`);
                }
                if (yearTo) {
                    yearToSelect.classList.add("filter-culprit");
                    reasons.push(`До година (${yearTo})`);
                }
                if (selectedDuration) {
                    durationSelect.classList.add("filter-culprit");
                    const durText = durationSelect?.options[durationSelect.selectedIndex]?.text ?? selectedDuration;
                    reasons.push(`Времетраене (${durText})`);
                }
                if (selectedPlayer) {
                    playerSelect.classList.add("filter-culprit");
                    reasons.push(`Плеър (${selectedPlayer})`);
                }
                if (selectedSource) {
                    sourceSelect.classList.add("filter-culprit");
                    reasons.push(`Източник (${selectedSource})`);
                }
                for (const b of allBadgeEls) {
                    if (state.selectedGenres.has(b.dataset.genre) || state.excludedGenres.has(b.dataset.genre)) {
                        b.classList.add("filter-culprit");
                    }
                }
                if (hasActiveGenres) {
                    reasons.push("Избрани жанрове");
                }
                if (state.typeFilter !== "all") {
                    const activeTabBtn = typeTabsBar.querySelector(".type-tab-btn.active");
                    if (activeTabBtn) {
                        activeTabBtn.classList.add("filter-culprit");
                    }
                    reasons.push("Избран таб");
                }
            }

            state.culpritReasons = reasons;
        }

        function applyFilters() {
            renderGenreBadges();
            const query = searchInput.value.trim().toLowerCase();
            const yearFrom = yearFromSelect.value;
            const yearTo = yearToSelect.value;
            const selectedDuration = durationSelect ? durationSelect.value : "";
            const selectedPlayer = playerSelect.value;
            const selectedSource = sourceSelect.value;
            const sortMode = sortSelect.value;

            const result = [];

            for (const item of state.items) {
                if (!matchesTypeTab(item)) {
                    continue;
                }

                if (state.audioSubFilter === "bg-audio" && !hasBgSource(item)) {
                    continue;
                }
                if (state.audioSubFilter === "sub" && !hasSubtitles(item)) {
                    continue;
                }

                if (!matchesEpisodes(item, state.episodesFilter)) {
                    continue;
                }

                if (!matchesMovieQuery(item, query)) {
                    continue;
                }

                if (!matchesSelectedGenres(item)) {
                    continue;
                }

                if (!matchesYearPeriod(item, yearFrom, yearTo)) {
                    continue;
                }

                if (!matchesDuration(item, selectedDuration)) {
                    continue;
                }

                if (!matchesSelectedPlayer(item, selectedPlayer)) {
                    continue;
                }

                if (!matchesSelectedSource(item, selectedSource)) {
                    continue;
                }

                result.push(item);
            }

            state.filtered = sortMoviesList(result, sortMode);
            state.visibleCount = PAGE_BATCH_SIZE;
            updateZeroResultFilterDiagnostics(query, yearFrom, yearTo, selectedDuration, selectedPlayer, selectedSource);
            renderMoviesGrid();
            saveFiltersToStorage();
        }

        function renderMoviesGrid() {
            statsCounter.innerHTML = `Намерени: <strong>${state.filtered.length}</strong> от <strong>${state.items.length}</strong>`;

            if (state.filtered.length === 0) {
                loadMoreWrap.style.display = "none";
                const emptyText = state.typeFilter === "watchlist" && state.watchlist.size === 0
                    ? "Все още нямаш маркирани заглавия за гледане по-късно (натисни 🔖 върху постер)."
                    : "Промени очертаните в червено филтри, за да се покажат резултати.";
                const reasonsList = Array.isArray(state.culpritReasons) && state.culpritReasons.length > 0
                    ? `<div class="culprit-reasons-box">⚠️ Филтри без съвпадение: ${escapeHtml(state.culpritReasons.join(" • "))}</div>`
                    : "";
                moviesContainer.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <h3>Няма намерени заглавия</h3>
                        <p>${emptyText}</p>
                        ${reasonsList}
                    </div>
                `;
                return;
            }

            const renderLimit = Math.min(state.filtered.length, state.visibleCount);
            let cardsHtml = "";
            for (let i = 0; i < renderLimit; i++) {
                const item = state.filtered[i];
                const title = escapeHtml(item.title ?? "Без заглавие");
                const poster = escapeHtml(item.poster_url ?? "");
                const year = item.year ? `${item.year}` : "—";
                const isTv = item.type === "tv";
                let durationOrSeasons = "";
                if (isTv) {
                    const sNum = item.seasons_count || getItemSeasonsCount(item) || 1;
                    const sText = sNum === 1 ? "1 сезон" : `${sNum} сезона`;
                    const epNum = item.total_episodes || getItemEpisodesCount(item);
                    const epText = epNum ? `${epNum} еп.` : "";
                    durationOrSeasons = epText ? `${sText} • ${epText}` : sText;
                } else if (item.duration_minutes) {
                    durationOrSeasons = `${item.duration_minutes} мин`;
                }

                const bgBadge = hasBgSource(item) ? `<span class="badge-bg-audio">BG</span>` : (hasSubtitles(item) ? `<span class="badge-sub">SUB</span>` : "");
                const castBadge = itemHasCastPlayer(item) ? `<span class="badge-cast" title="Поддържа Cast към ТВ">📺 Cast</span>` : "";
                const typeBadge = isTv
                    ? `<span class="badge-media-type badge-type-tv">📺 СЕРИАЛ</span>`
                    : `<span class="badge-media-type badge-type-movie">🎬 ФИЛМ</span>`;
                const ageBadge = item.age_rating ? `<span class="badge-age">${escapeHtml(item.age_rating)}</span>` : "";

                let genresHtml = "";
                const rawGenres = Array.isArray(item.genres) ? item.genres : [];
                const displayGenres = [];
                for (const genre of rawGenres) {
                    if (`${genre}`.trim().toLowerCase() === "бг аудио") {
                        continue;
                    }
                    displayGenres.push(genre);
                    if (displayGenres.length >= 3) {
                        break;
                    }
                }
                for (const genre of displayGenres) {
                    genresHtml = `${genresHtml}<span class="genre-pill">${escapeHtml(genre)}</span>`;
                }

                let sourceBadgesHtml = "";
                const origins = Array.isArray(item.origins) && item.origins.length > 0 ? item.origins : ["ZenoPlay"];
                for (const orig of origins) {
                    const origClass = orig.toLowerCase().replace(/[^a-z0-9]/g, "");
                    sourceBadgesHtml = `${sourceBadgesHtml}<span class="src-pill src-${origClass}">${orig}</span>`;
                }

                cardsHtml = `${cardsHtml}
                    <article class="movie-card" tabindex="0" data-movie-index="${i}">
                        <div class="poster-wrap">
                            <img src="${poster}" alt="${title}" loading="lazy" referrerpolicy="no-referrer" onerror="this.classList.add('img-fallback')">
                            <div class="poster-badges-top-right">
                                ${bgBadge}
                                ${castBadge}
                            </div>
                            ${typeBadge}
                            ${ageBadge}
                            <button type="button" class="card-play-fullscreen-btn" data-movie-index="${i}" aria-label="Пусни на голям екран" title="Пусни на голям екран" tabindex="-1" aria-hidden="true">▶</button>
                        </div>
                        <div class="card-body">
                            <h3 class="card-title" title="${title}">${title}</h3>
                            <div class="card-meta">
                                <span>${year}</span>
                                ${item.rating ? `<span class="card-meta-rating">★ ${item.rating}</span>` : ""}
                                ${durationOrSeasons ? `<span>• ${durationOrSeasons}</span>` : ""}
                            </div>
                            <div class="card-sources">${sourceBadgesHtml}</div>
                            <div class="card-genres">${genresHtml}</div>
                        </div>
                    </article>
                `;
            }

            moviesContainer.innerHTML = cardsHtml;
            const remaining = state.filtered.length - renderLimit;
            if (remaining > 0) {
                loadMoreWrap.style.display = "block";
                loadMoreBtn.textContent = `Покажи още (${remaining} оставащи)`;
                return;
            }
            loadMoreWrap.style.display = "none";
        }

        function buildTvEpisodeSources(tmdbId, seasonNum, episodeNum, episodeUrl) {
            const sources = [];
            if (tmdbId) {
                for (const provider of TV_EMBED_TEMPLATES) {
                    const url = provider.tpl
                        .replaceAll("{tmdb}", `${tmdbId}`)
                        .replaceAll("{s}", `${seasonNum}`)
                        .replaceAll("{e}", `${episodeNum}`);
                    sources.push({
                        id: provider.id,
                        name: provider.name,
                        group: "en",
                        embed_url: url
                    });
                }
            }
            if (episodeUrl) {
                sources.push({
                    id: "custom-1",
                    name: "🇧🇬 ZenoPlay",
                    group: "bg",
                    embed_url: `${episodeUrl}#player`,
                    direct_embed: false
                });
            }
            return sources;
        }

        function isBgPlayerSource(source) {
            if (!source) {
                return false;
            }
            if (source.group === "bg") {
                return true;
            }
            const name = `${source.name ?? ""}`.toLowerCase();
            if (name.includes("bg") || name.includes("бг") || name.includes("български") || name.includes("🇧🇬")) {
                return true;
            }
            const origin = `${source.origin ?? source.source_origin ?? ""}`.toLowerCase();
            if (origin.includes("bg") || origin.includes("filmizip") || origin.includes("bg_serials")) {
                return true;
            }
            if ((origin.includes("filmi2k") || origin.includes("filmifen")) && !origin.includes("sub")) {
                return true;
            }
            return false;
        }

        function sortPlayerSources(sources) {
            if (!Array.isArray(sources) || sources.length <= 1) {
                return sources;
            }
            const getPriority = (s) => {
                const isDirect = s.direct_embed !== false && Boolean(s.embed_url);
                const isBg = isBgPlayerSource(s);
                if (isDirect && isBg) {
                    return 0;
                }
                if (isDirect && !isBg) {
                    return 1;
                }
                if (!isDirect && isBg) {
                    return 2;
                }
                return 3;
            };
            return [...sources].sort((a, b) => getPriority(a) - getPriority(b));
        }

        function getActivePlayerSources(item) {
            const rawSources = Array.isArray(item.player_sources) ? item.player_sources : [];
            const active = [];
            const seenIds = new Set();
            for (const s of rawSources) {
                if (!s || !s.name || DISABLED_PLAYERS.has(s.name)) {
                    continue;
                }
                seenIds.add(s.id);
                if (s.name === "BG Player" || s.id === "custom-1") {
                    const zenoUrl = item.url ? `${item.url}#player` : s.embed_url;
                    active.push({
                        ...s,
                        name: "🇧🇬 ZenoPlay",
                        embed_url: zenoUrl,
                        direct_embed: false
                    });
                    continue;
                }
                active.push(s);
            }

            if (item.tmdb_id) {
                for (const tpl of MOVIE_EMBED_TEMPLATES) {
                    if (seenIds.has(tpl.id) || DISABLED_PLAYERS.has(tpl.name)) {
                        continue;
                    }
                    seenIds.add(tpl.id);
                    active.push({
                        id: tpl.id,
                        name: tpl.name,
                        group: "en",
                        embed_url: tpl.tpl.replace("{tmdb}", `${item.tmdb_id}`)
                    });
                }
            }

            return sortPlayerSources(active.length > 0 ? active : rawSources);
        }

        function buildPlayerSectionMarkup(item) {
            const isTv = item.type === "tv";
            let sources = isTv ? [] : getActivePlayerSources(item);
            let relationUrl = item.url ? `${escapeHtml(item.url)}#player` : "";
            let tvControlsHtml = "";

            if (isTv) {
                const seasons = Array.isArray(item.seasons) ? item.seasons : [];
                const activeSeason = seasons[state.activeSeasonIndex] ?? seasons[0];
                const episodes = activeSeason && Array.isArray(activeSeason.episodes) ? activeSeason.episodes : [];
                const activeEpisode = episodes[state.activeEpisodeIndex] ?? episodes[0];

                let seasonsBtns = "";
                for (let sIdx = 0; sIdx < seasons.length; sIdx++) {
                    const sObj = seasons[sIdx];
                    const activeCls = sIdx === state.activeSeasonIndex ? "active" : "";
                    seasonsBtns = `${seasonsBtns}<button type="button" class="season-btn ${activeCls}" data-season-idx="${sIdx}">Сезон ${sObj.season}</button>`;
                }

                const sNum = activeSeason ? (activeSeason.season ?? activeSeason.season_number ?? 1) : 1;
                const eNum = activeEpisode ? (activeEpisode.episode ?? activeEpisode.episode_number ?? 1) : 1;

                let episodesBtns = "";
                for (let eIdx = 0; eIdx < episodes.length; eIdx++) {
                    const eObj = episodes[eIdx];
                    const activeCls = eIdx === state.activeEpisodeIndex ? "active" : "";
                    const epNumber = eObj.episode ?? eObj.episode_number ?? (eIdx + 1);
                    const hasBg = Boolean(eObj.has_bg) ||
                        (Array.isArray(eObj.player_sources) && eObj.player_sources.length > 0) ||
                        (Array.isArray(item.player_sources) && item.player_sources.some(p => p.season === sNum && p.episode === epNumber));
                    const bgMarker = hasBg ? " 🇧🇬" : "";
                    episodesBtns = `${episodesBtns}<button type="button" class="episode-btn ${activeCls}" data-episode-idx="${eIdx}">Еп. ${epNumber}${bgMarker}</button>`;
                }

                if (seasonsBtns || episodesBtns) {
                    tvControlsHtml = `
                        <div class="tv-seasons-bar">${seasonsBtns}</div>
                        <div class="tv-episodes-bar">${episodesBtns}</div>
                    `;
                }

                const epUrl = activeEpisode && activeEpisode.url ? activeEpisode.url : item.url;
                relationUrl = epUrl ? `${escapeHtml(epUrl)}#player` : relationUrl;

                const bgEpisodeSources = [];
                if (activeEpisode && Array.isArray(activeEpisode.player_sources)) {
                    for (const ps of activeEpisode.player_sources) {
                        if (ps && ps.embed_url && !bgEpisodeSources.some(s => s.embed_url === ps.embed_url)) {
                            bgEpisodeSources.push({
                                ...ps,
                                direct_embed: ps.direct_embed !== undefined ? ps.direct_embed : true,
                                group: "bg"
                            });
                        }
                    }
                }

                const tvSources = Array.isArray(item.player_sources) ? item.player_sources : [];
                for (const ts of tvSources) {
                    if (!ts || !ts.embed_url) {
                        continue;
                    }
                    const matchS = ts.season === undefined || ts.season === null || ts.season === sNum;
                    const matchE = ts.episode === undefined || ts.episode === null || ts.episode === eNum;
                    if (matchS && matchE) {
                        if (!bgEpisodeSources.some(s => s.embed_url === ts.embed_url)) {
                            bgEpisodeSources.push({
                                ...ts,
                                direct_embed: ts.direct_embed !== undefined ? ts.direct_embed : (ts.group === "bg" ? true : false),
                                group: ts.group || "bg"
                            });
                        }
                    }
                }

                const multiSources = buildTvEpisodeSources(item.tmdb_id, sNum, eNum, epUrl);
                sources = sortPlayerSources([...bgEpisodeSources, ...multiSources]);
            }

            let embeddedTabsHtml = "";
            let externalTabsHtml = "";
            let firstEmbedUrl = "";

            for (let i = 0; i < sources.length; i++) {
                const source = sources[i];
                const groupLabel = source.group ? ` (${source.group.toUpperCase()})` : "";
                const castMarker = isCastPlayer(source.name) ? " 📺" : "";

                if (source.direct_embed === false) {
                    const targetUrl = source.embed_url || relationUrl;
                    if (targetUrl) {
                        externalTabsHtml = `${externalTabsHtml}
                            <a class="player-tab player-tab-relation" href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer">
                                ${escapeHtml(source.name)}${castMarker}${escapeHtml(groupLabel)} ↗
                            </a>
                        `;
                        continue;
                    }
                }

                const isFirstEmbed = firstEmbedUrl === "";
                if (isFirstEmbed) {
                    firstEmbedUrl = escapeHtml(source.embed_url);
                }
                const activeClass = isFirstEmbed ? "active" : "";
                const isBgEmbed = source.direct_embed && (source.group === "bg" || `${source.name}`.includes("🇧🇬"));
                const isSubEmbed = source.direct_embed && (source.group === "sub" || `${source.name}`.includes("💬"));
                const bgEmbedClass = isBgEmbed ? "player-tab-bg-embed" : (isSubEmbed ? "player-tab-sub-embed" : "");
                embeddedTabsHtml = `${embeddedTabsHtml}
                    <button type="button" class="player-tab ${bgEmbedClass} ${activeClass}" data-embed-url="${escapeHtml(source.embed_url)}">
                        ${escapeHtml(source.name)}${castMarker}${escapeHtml(groupLabel)}
                    </button>
                `;
            }

            const f2kUrl = item.filmi2k_url || (item.url && item.url.includes("filmi2k.com") ? item.url : "");
            if (f2kUrl && !externalTabsHtml.includes("filmi2k.com")) {
                externalTabsHtml = `${externalTabsHtml}
                    <a class="player-tab player-tab-relation" href="${escapeHtml(f2kUrl)}" target="_blank" rel="noopener noreferrer">
                        🇧🇬 Filmi2k ↗
                    </a>
                `;
            }

            const fzUrl = item.filmizip_url || (item.url && item.url.includes("filmizip.com") ? item.url : "");
            if (fzUrl && !externalTabsHtml.includes("filmizip.com")) {
                externalTabsHtml = `${externalTabsHtml}
                    <a class="player-tab player-tab-relation" href="${escapeHtml(fzUrl)}" target="_blank" rel="noopener noreferrer">
                        🇧🇬 FilmiZip ↗
                    </a>
                `;
            }

            const f9Url = item.filmi9_url || (item.url && item.url.includes("filmi9.com") ? item.url : "");
            if (f9Url && !externalTabsHtml.includes("filmi9.com")) {
                externalTabsHtml = `${externalTabsHtml}
                    <a class="player-tab player-tab-relation" href="${escapeHtml(f9Url)}" target="_blank" rel="noopener noreferrer">
                        💬 Filmi9 ↗
                    </a>
                `;
            }

            if (!firstEmbedUrl && !tvControlsHtml && !embeddedTabsHtml && !externalTabsHtml) {
                return "";
            }

            const openAttr = "";
            let activePlayerName = "";
            for (let i = 0; i < sources.length; i++) {
                const s = sources[i];
                if (s.direct_embed !== false && s.embed_url) {
                    activePlayerName = s.name || "Плеър";
                    break;
                }
            }
            const activePlayerBadge = activePlayerName ? `<b class="active-player-name" id="activePlayerSummaryBadge">${escapeHtml(activePlayerName)}</b>` : "";

            return `
                <div class="modal-player-section" id="modalPlayerSection">
                    ${tvControlsHtml}
                    ${embeddedTabsHtml ? `
                        <details class="player-accordion" id="directPlayersDetails" ${openAttr}>
                            <summary class="player-accordion-summary">
                                <span class="player-accordion-title">
                                    ▶ Директни плеъри (вградени)${activePlayerBadge ? `: ${activePlayerBadge}` : ""}
                                </span>
                                <span class="accordion-chevron">▾</span>
                            </summary>
                            <div class="player-tabs" id="modalPlayerTabs">${embeddedTabsHtml}</div>
                        </details>
                    ` : ""}
                    ${externalTabsHtml ? `
                        <details class="player-accordion player-accordion-external" id="externalPlayersDetails" ${embeddedTabsHtml ? openAttr : "open"}>
                            <summary class="player-accordion-summary">
                                <span class="player-accordion-title">
                                    ↗ Външни източници (отвори в нов таб)
                                </span>
                                <span class="accordion-chevron">▾</span>
                            </summary>
                            <div class="player-tabs player-tabs-external">${externalTabsHtml}</div>
                        </details>
                    ` : ""}
                    ${firstEmbedUrl ? `
                        <div class="player-toolbar-row">
                            <span class="player-current-label">▶ Видео плеър:</span>
                            <button type="button" class="theater-fullscreen-btn" id="theaterFullscreenBtn" title="Цял екран на плеъра">⛶ Цял екран</button>
                        </div>
                        <div class="player-frame-box" id="mainPlayerFrameBox">
                            <button type="button" class="exit-theater-btn" id="exitTheaterBtn" title="Свий плеъра (Изход от цял екран)">↙ Свий плеъра</button>
                            <iframe id="modalPlayerIframe" src="${firstEmbedUrl}" allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *; accelerometer; gyroscope" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" playsinline="true" webkit-playsinline="true"></iframe>
                        </div>
                    ` : ""}
                </div>
            `;
        }

        function getMovieIdentifier(item) {
            if (item.slug) {
                return item.slug;
            }
            if (item.post_id) {
                return `${item.post_id}`;
            }
            if (item.title) {
                return item.title;
            }
            return "movie";
        }

        function openIntermediateScreen(item) {
            state.activeIntermediateItem = item;
            state.savedScrollY = window.scrollY;

            const movieIdentifier = getMovieIdentifier(item);
            const targetHash = `#movie=${encodeURIComponent(movieIdentifier)}`;
            if (window.location.hash !== targetHash) {
                window.history.pushState({ page: "intermediate", id: movieIdentifier }, "", targetHash);
            }

            const title = escapeHtml(item.title ?? "Без заглавие");
            const poster = escapeHtml(item.poster_url ?? "");
            const year = item.year ? `${item.year}` : "";
            const isTv = item.type === "tv";

            if (intermediateTitle) {
                intermediateTitle.textContent = title;
            }
            if (intermediatePoster) {
                intermediatePoster.src = poster;
                intermediatePoster.alt = title;
            }

            const bgUrl = item.backdrop_url || item.poster_url || "";
            if (intermediateScreen) {
                if (bgUrl) {
                    intermediateScreen.style.backgroundImage = `url('${escapeHtml(bgUrl)}')`;
                } else {
                    intermediateScreen.style.backgroundImage = "none";
                }
            }

            let metaHtml = "";
            metaHtml = `${metaHtml}<span class="modal-type-pill ${isTv ? "modal-type-tv" : "modal-type-movie"}">${isTv ? "📺 Сериал" : "🎬 Филм"}</span>`;
            if (hasBgSource(item)) {
                metaHtml = `${metaHtml}<span class="modal-bg-pill">🇧🇬 БГ Аудио</span>`;
            }
            if (year) {
                metaHtml = `${metaHtml}<span>📅 ${year}</span>`;
            }
            if (!isTv && item.duration_minutes) {
                metaHtml = `${metaHtml}<span>⏱ ${item.duration_minutes} мин</span>`;
            }
            if (isTv) {
                const sNum = item.seasons_count || getItemSeasonsCount(item) || 1;
                metaHtml = `${metaHtml}<span>📺 ${sNum === 1 ? "1 сезон" : `${sNum} сезона`}</span>`;
            }
            if (item.rating) {
                metaHtml = `${metaHtml}<span class="modal-rating-pill">★ ${item.rating}</span>`;
            }
            const origins = Array.isArray(item.origins) && item.origins.length > 0 ? item.origins : ["ZenoPlay"];
            for (const orig of origins) {
                const origClass = orig.toLowerCase().replace(/[^a-z0-9]/g, "");
                metaHtml = `${metaHtml}<span class="src-pill src-${origClass}">${orig}</span>`;
            }
            if (intermediateMetaRow) {
                intermediateMetaRow.innerHTML = metaHtml;
            }

            if (intermediateOverview) {
                intermediateOverview.textContent = item.overview || "Няма налично описание.";
            }

            if (intermediateScreen) {
                intermediateScreen.style.display = "flex";
                intermediateScreen.classList.add("open");
            }
            document.body.classList.add("movie-page-active");

            setTimeout(() => {
                if (intermediatePlayBtn) {
                    intermediatePlayBtn.focus();
                }
            }, 60);
        }

        function closeIntermediateScreen(fromPopstate = false) {
            if (!fromPopstate && window.location.hash.startsWith("#movie=")) {
                window.history.back();
                return;
            }
            if (intermediateScreen) {
                intermediateScreen.classList.remove("open");
                intermediateScreen.style.display = "none";
            }
            document.body.classList.remove("movie-page-active");
            state.activeIntermediateItem = null;
            if (typeof state.savedScrollY === "number") {
                window.scrollTo({ top: state.savedScrollY, behavior: "instant" });
            }
            if (state.lastFocusedCardIndex !== null) {
                const prevCard = moviesContainer.querySelector(`.movie-card[data-movie-index="${state.lastFocusedCardIndex}"]`);
                if (prevCard) {
                    prevCard.focus();
                }
            }
        }

        function handleIntermediatePlay() {
            const item = state.activeIntermediateItem;
            if (!item) {
                return;
            }
            if (intermediateScreen) {
                intermediateScreen.classList.remove("open");
                intermediateScreen.style.display = "none";
            }
            openMovieModal(item);
            const box = document.getElementById("mainPlayerFrameBox");
            if (box) {
                setTimeout(() => {
                    enterPlayerFullscreen(box);
                }, 80);
            }
        }

        function handleIntermediateInfo() {
            const item = state.activeIntermediateItem;
            if (!item) {
                return;
            }
            if (intermediateScreen) {
                intermediateScreen.classList.remove("open");
                intermediateScreen.style.display = "none";
            }
            openMovieModal(item);
        }

            state.activeModalItem = item;
            state.activeSeasonIndex = 0;
            state.activeEpisodeIndex = 0;

            const targetHash = `#movie=${encodeURIComponent(movieIdentifier)}`;
            if (window.location.hash !== targetHash) {
                window.history.pushState({ page: "movie", id: movieIdentifier }, "", targetHash);
            }

            const title = escapeHtml(item.title ?? "");
            const poster = escapeHtml(item.poster_url ?? "");

                : "";

            let genresHtml = "";

                    continue;
                }
                genresHtml = `${genresHtml}<span class="chip">${escapeHtml(genre)}</span>`;
            }

            let tagsHtml = "";
            const tags = Array.isArray(item.tags) ? item.tags : [];
            for (const tag of tags) {
                tagsHtml = `${tagsHtml}<span class="chip chip-tag">#${escapeHtml(tag)}</span>`;
            }

            const countries = Array.isArray(item.countries) ? item.countries.join(", ") : "";

            const saved = isInWatchlist(item);
            const savedClass = saved ? "saved" : "";
            const savedLabel = saved ? "🔖 В списъка „За по-късно“" : "🔖 Добави в „За по-късно“";

            let modalSourcesHtml = "";
            const origins = Array.isArray(item.origins) && item.origins.length > 0 ? item.origins : ["ZenoPlay"];
            for (const orig of origins) {
                const origClass = orig.toLowerCase().replace(/[^a-z0-9]/g, "");
                modalSourcesHtml = `${modalSourcesHtml}<span class="src-pill src-${origClass}">${orig}</span>`;
            }

            const isTv = item.type === "tv";
            const typePill = isTv
                ? `<span class="modal-type-pill modal-type-tv">📺 Сериал</span>`
                : `<span class="modal-type-pill modal-type-movie">🎬 Филм</span>`;

            modalBody.innerHTML = `
                <div class="modal-hero" ${backdropStyle}>
                    <div class="modal-layout">
                        <img class="modal-poster" src="${poster}" alt="${title}" referrerpolicy="no-referrer" onerror="this.style.display='none'">
                        <div class="modal-info">
                            <h2>${title}</h2>
                            <div class="modal-submeta">
                                ${typePill}
                                ${hasBgSource(item) ? '<span class="modal-bg-pill">БГ Аудио</span>' : ""}
                                ${itemHasCastPlayer(item) ? '<span class="modal-cast-pill">📺 Cast към TV</span>' : ""}
                                ${item.year ? `<span>📅 ${item.year}</span>` : ""}
                                ${!isTv && item.duration_minutes ? `<span>⏱ ${item.duration_minutes} мин</span>` : ""}
                                ${isTv ? `<span>📺 ${(item.seasons_count || getItemSeasonsCount(item) || 1) === 1 ? "1 сезон" : `${item.seasons_count || getItemSeasonsCount(item) || 1} сезона`}</span>` : ""}
                                ${isTv && (item.total_episodes || getItemEpisodesCount(item)) ? `<span>🎬 ${item.total_episodes || getItemEpisodesCount(item)} епизода</span>` : ""}
                                ${item.rating ? `<span class="modal-rating-pill">★ ${item.rating}</span>` : ""}
                                ${countries ? `<span>🌍 ${escapeHtml(countries)}</span>` : ""}

        function checkUrlMovieHash() {
            if (!window.location.hash.startsWith("#movie=")) {
                if (movieModal.classList.contains("open")) {
                    closeMovieModal(true);
                }
                if (intermediateScreen && intermediateScreen.classList.contains("open")) {
                    closeIntermediateScreen(true);
                }
                return;
            }
            if (state.activeModalItem || state.activeIntermediateItem) {
                return;
            }
            const rawTarget = decodeURIComponent(window.location.hash.slice(7)).trim();
            if (!rawTarget || !Array.isArray(state.items) || state.items.length === 0) {
                return;
            }
            const target = rawTarget.toLowerCase();
            const foundItem = state.items.find((m) => {
                if (m.slug && m.slug.toLowerCase() === target) {
                    return true;
                }
                if (m.post_id && `${m.post_id}` === target) {
                    return true;
                }
                if (m.title && m.title.toLowerCase() === target) {
                    return true;
                }
                return false;
            });
            if (foundItem) {
                openIntermediateScreen(foundItem);
            }
