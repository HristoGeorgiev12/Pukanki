        function buildTvEpisodeSources(tmdbId, seasonNum, episodeNum, episodeUrl) {
            const sources = [];
            if (tmdbId) {
                for (const provider of TV_EMBED_TEMPLATES) {
                    const url = provider.tpl
                        .replaceAll("{tmdb}", `${tmdbId}`)
                        .replaceAll("{s}", `${seasonNum}`)
                        .replaceAll("{e}", `${episodeNum}`);
                    sources.push({
                        id: provider.id,
                        name: provider.name,
                        group: "en",
                        embed_url: url
                    });
                }
            }
            if (episodeUrl) {
                sources.push({
                    id: "custom-1",
                    name: "🇧🇬 ZenoPlay",
                    group: "bg",
                    embed_url: `${episodeUrl}#player`,
                    direct_embed: false
                });
            }
            return sources;
        }

        function isBgPlayerSource(source) {
            if (!source) {
                return false;
            }
            if (source.group === "bg") {
                return true;
            }
            const name = `${source.name ?? ""}`.toLowerCase();
            if (name.includes("bg") || name.includes("бг") || name.includes("български") || name.includes("🇧🇬")) {
                return true;
            }
            const origin = `${source.origin ?? source.source_origin ?? ""}`.toLowerCase();
            if (origin.includes("bg") || origin.includes("filmizip") || origin.includes("bg_serials")) {
                return true;
            }
            if ((origin.includes("filmi2k") || origin.includes("filmifen")) && !origin.includes("sub")) {
                return true;
            }
            return false;
        }

        function sortPlayerSources(sources) {
            if (!Array.isArray(sources) || sources.length <= 1) {
                return sources;
            }
            const getPriority = (s) => {
                const isDirect = s.direct_embed !== false && Boolean(s.embed_url);
                const isBg = isBgPlayerSource(s);
                const name = `${s.name ?? ""}`.toLowerCase();
                const url = `${s.embed_url ?? ""}`.toLowerCase();

                if (isDirect && isBg) {
                    if (name.includes("ok.ru") || url.includes("ok.ru")) {
                        return 0;
                    }
                    if (name.includes("voe") || url.includes("voe.sx")) {
                        return 1;
                    }
                    if (name.includes("filemoon") || url.includes("filemoon")) {
                        return 2;
                    }
                    if (name.includes("vidon") || url.includes("vidon.to")) {
                        return 3;
                    }
                    if (name.includes("streamtape") || url.includes("streamtape")) {
                        return 4;
                    }
                    return 5;
                }
                if (isDirect && !isBg) {
                    if (name.includes("voe") || url.includes("voe.sx")) {
                        return 10;
                    }
                    if (name.includes("vidlink") || url.includes("vidlink.pro")) {
                        return 11;
                    }
                    if (name.includes("embedmaster") || url.includes("embedmaster.link")) {
                        return 12;
                    }
                    if (name.includes("vidsrc") || url.includes("vidsrc")) {
                        return 13;
                    }
                    if (name.includes("1src") || url.includes("1src.org")) {
                        return 14;
                    }
                    return 15;
                }
                if (!isDirect && isBg) {
                    return 20;
                }
                return 21;
            };
            return [...sources].sort((a, b) => getPriority(a) - getPriority(b));
        }

        function getActivePlayerSources(item) {
            const rawSources = Array.isArray(item.player_sources) ? item.player_sources : [];
            const active = [];
            const seenIds = new Set();
            for (const s of rawSources) {
                if (!s || !s.name || DISABLED_PLAYERS.has(s.name)) {
                    continue;
                }
                seenIds.add(s.id);
                if (s.name === "BG Player" || s.id === "custom-1") {
                    const zenoUrl = item.url ? `${item.url}#player` : s.embed_url;
                    active.push({
                        ...s,
                        name: "🇧🇬 ZenoPlay",
                        embed_url: zenoUrl,
                        direct_embed: false
                    });
                    continue;
                }
                active.push(s);
            }

            if (item.tmdb_id) {
                for (const tpl of MOVIE_EMBED_TEMPLATES) {
                    if (seenIds.has(tpl.id) || DISABLED_PLAYERS.has(tpl.name)) {
                        continue;
                    }
                    seenIds.add(tpl.id);
                    active.push({
                        id: tpl.id,
                        name: tpl.name,
                        group: "en",
                        embed_url: tpl.tpl.replace("{tmdb}", `${item.tmdb_id}`)
                    });
                }
            }

            return sortPlayerSources(active.length > 0 ? active : rawSources);
        }

        function buildPlayerSectionMarkup(item) {
            const isTv = item.type === "tv";
            let sources = isTv ? [] : getActivePlayerSources(item);
            let relationUrl = item.url ? `${escapeHtml(item.url)}#player` : "";
            let tvControlsHtml = "";

            if (isTv) {
                const seasons = Array.isArray(item.seasons) ? item.seasons : [];
                const activeSeason = seasons[state.activeSeasonIndex] ?? seasons[0];
                const episodes = activeSeason && Array.isArray(activeSeason.episodes) ? activeSeason.episodes : [];
                const activeEpisode = episodes[state.activeEpisodeIndex] ?? episodes[0];

                let seasonsBtns = "";
                for (let sIdx = 0; sIdx < seasons.length; sIdx++) {
                    const sObj = seasons[sIdx];
                    const activeCls = sIdx === state.activeSeasonIndex ? "active" : "";
                    seasonsBtns = `${seasonsBtns}<button type="button" class="season-btn ${activeCls}" data-season-idx="${sIdx}">Сезон ${sObj.season}</button>`;
                }

                const sNum = activeSeason ? (activeSeason.season ?? activeSeason.season_number ?? 1) : 1;
                const eNum = activeEpisode ? (activeEpisode.episode ?? activeEpisode.episode_number ?? 1) : 1;

                let episodesBtns = "";
                for (let eIdx = 0; eIdx < episodes.length; eIdx++) {
                    const eObj = episodes[eIdx];
                    const activeCls = eIdx === state.activeEpisodeIndex ? "active" : "";
                    const epNumber = eObj.episode ?? eObj.episode_number ?? (eIdx + 1);
                    const hasBg = Boolean(eObj.has_bg) ||
                        (Array.isArray(eObj.player_sources) && eObj.player_sources.length > 0) ||
                        (Array.isArray(item.player_sources) && item.player_sources.some(p => p.season === sNum && p.episode === epNumber));
                    const bgMarker = hasBg ? " 🇧🇬" : "";
                    episodesBtns = `${episodesBtns}<button type="button" class="episode-btn ${activeCls}" data-episode-idx="${eIdx}">Еп. ${epNumber}${bgMarker}</button>`;
                }

                if (seasonsBtns || episodesBtns) {
                    tvControlsHtml = `
                        <div class="tv-seasons-bar">${seasonsBtns}</div>
                        <div class="tv-episodes-bar">${episodesBtns}</div>
                    `;
                }

                const epUrl = activeEpisode && activeEpisode.url ? activeEpisode.url : item.url;
                relationUrl = epUrl ? `${escapeHtml(epUrl)}#player` : relationUrl;

                const bgEpisodeSources = [];
                if (activeEpisode && Array.isArray(activeEpisode.player_sources)) {
                    for (const ps of activeEpisode.player_sources) {
                        if (ps && ps.embed_url && !bgEpisodeSources.some(s => s.embed_url === ps.embed_url)) {
                            bgEpisodeSources.push({
                                ...ps,
                                direct_embed: ps.direct_embed !== undefined ? ps.direct_embed : true,
                                group: "bg"
                            });
                        }
                    }
                }

                const tvSources = Array.isArray(item.player_sources) ? item.player_sources : [];
                for (const ts of tvSources) {
                    if (!ts || !ts.embed_url) {
                        continue;
                    }
                    const matchS = ts.season === undefined || ts.season === null || ts.season === sNum;
                    const matchE = ts.episode === undefined || ts.episode === null || ts.episode === eNum;
                    if (matchS && matchE) {
                        if (!bgEpisodeSources.some(s => s.embed_url === ts.embed_url)) {
                            bgEpisodeSources.push({
                                ...ts,
                                direct_embed: ts.direct_embed !== undefined ? ts.direct_embed : (ts.group === "bg" ? true : false),
                                group: ts.group || "bg"
                            });
                        }
                    }
                }

                const multiSources = buildTvEpisodeSources(item.tmdb_id, sNum, eNum, epUrl);
                sources = sortPlayerSources([...bgEpisodeSources, ...multiSources]);
            }

            let embeddedTabsHtml = "";
            let externalTabsHtml = "";
            let firstEmbedUrl = "";

            for (let i = 0; i < sources.length; i++) {
                const source = sources[i];
                const groupLabel = source.group ? ` (${source.group.toUpperCase()})` : "";
                const hasCast = isCastPlayer(source.name, source.embed_url);
                const castMarker = hasCast ? `<span class="player-tab-cast-star" title="Поддържа Cast към ТВ">★</span>` : "";
                const qualityLabel = getPlayerQualityLabel(source);
                const qualityMarker = qualityLabel ? ` <span class="player-tab-quality-tag">${qualityLabel}</span>` : "";

                if (source.direct_embed === false) {
                    const targetUrl = source.embed_url || relationUrl;
                    if (targetUrl) {
                        externalTabsHtml = `${externalTabsHtml}
                            <a class="player-tab player-tab-relation" href="${escapeHtml(targetUrl)}" target="_blank" rel="noopener noreferrer">
                                ${escapeHtml(source.name)}${castMarker}${qualityMarker}${escapeHtml(groupLabel)} ↗
                            </a>
                        `;
                        continue;
                    }
                }

                const isFirstEmbed = firstEmbedUrl === "";
                if (isFirstEmbed) {
                    firstEmbedUrl = escapeHtml(source.embed_url);
                }
                const activeClass = isFirstEmbed ? "active" : "";
                const isBgEmbed = source.direct_embed && (source.group === "bg" || `${source.name}`.includes("🇧🇬"));
                const isSubEmbed = source.direct_embed && (source.group === "sub" || `${source.name}`.includes("💬"));
                const bgEmbedClass = isBgEmbed ? "player-tab-bg-embed" : (isSubEmbed ? "player-tab-sub-embed" : "");
                embeddedTabsHtml = `${embeddedTabsHtml}
                    <button type="button" class="player-tab ${bgEmbedClass} ${activeClass}" data-embed-url="${escapeHtml(source.embed_url)}">
                        ${escapeHtml(source.name)}${castMarker}${qualityMarker}${escapeHtml(groupLabel)}
                    </button>
                `;
            }

            const f2kUrl = item.filmi2k_url || (item.url && item.url.includes("filmi2k.com") ? item.url : "");
            if (f2kUrl && !externalTabsHtml.includes("filmi2k.com")) {
                externalTabsHtml = `${externalTabsHtml}
                    <a class="player-tab player-tab-relation" href="${escapeHtml(f2kUrl)}" target="_blank" rel="noopener noreferrer">
                        🇧🇬 Filmi2k ↗
                    </a>
                `;
            }

            const fzUrl = item.filmizip_url || (item.url && item.url.includes("filmizip.com") ? item.url : "");
            if (fzUrl && !externalTabsHtml.includes("filmizip.com")) {
                externalTabsHtml = `${externalTabsHtml}
                    <a class="player-tab player-tab-relation" href="${escapeHtml(fzUrl)}" target="_blank" rel="noopener noreferrer">
                        🇧🇬 FilmiZip ↗
                    </a>
                `;
            }

            const f9Url = item.filmi9_url || (item.url && item.url.includes("filmi9.com") ? item.url : "");
            if (f9Url && !externalTabsHtml.includes("filmi9.com")) {
                externalTabsHtml = `${externalTabsHtml}
                    <a class="player-tab player-tab-relation" href="${escapeHtml(f9Url)}" target="_blank" rel="noopener noreferrer">
                        💬 Filmi9 ↗
                    </a>
                `;
            }

            if (!firstEmbedUrl && !tvControlsHtml && !embeddedTabsHtml && !externalTabsHtml) {
                return "";
            }

            const openAttr = "";
            let activePlayerName = "";
            for (let i = 0; i < sources.length; i++) {
                const s = sources[i];
                if (s.direct_embed !== false && s.embed_url) {
                    activePlayerName = s.name || "Плеър";
                    break;
                }
            }
            const activePlayerBadge = activePlayerName ? `<b class="active-player-name" id="activePlayerSummaryBadge">${escapeHtml(activePlayerName)}</b>` : "";

            return `
                <div class="modal-player-section" id="modalPlayerSection">
                    ${tvControlsHtml}
                    ${embeddedTabsHtml ? `
                        <details class="player-accordion" id="directPlayersDetails" ${openAttr}>
                            <summary class="player-accordion-summary">
                                <span class="player-accordion-title">
                                    ▶ Директни плеъри (вградени)${activePlayerBadge ? `: ${activePlayerBadge}` : ""}
                                </span>
                                <span class="accordion-chevron">▾</span>
                            </summary>
                            <div class="player-tabs" id="modalPlayerTabs">${embeddedTabsHtml}</div>
                        </details>
                    ` : ""}
                    ${externalTabsHtml ? `
                        <details class="player-accordion player-accordion-external" id="externalPlayersDetails" ${embeddedTabsHtml ? openAttr : "open"}>
                            <summary class="player-accordion-summary">
                                <span class="player-accordion-title">
                                    ↗ Външни източници (отвори в нов таб)
                                </span>
                                <span class="accordion-chevron">▾</span>
                            </summary>
                            <div class="player-tabs player-tabs-external">${externalTabsHtml}</div>
                        </details>
                    ` : ""}
                    ${firstEmbedUrl ? `
                        <div class="player-toolbar-row">
                            <span class="player-current-label">▶ Видео плеър:</span>
                            <button type="button" class="theater-fullscreen-btn" id="theaterFullscreenBtn" title="Цял екран на плеъра">⛶ Цял екран</button>
                        </div>
                        ${detectCamQuality(item) ? `<div class="cam-warning-banner">⚠️ Внимание: Запис от киносалон (CAM/TS). Картината може да е с по-ниско качество.</div>` : ""}

                            <button type="button" class="exit-theater-btn" id="exitTheaterBtn" title="Свий плеъра (Изход от цял екран)">↙ Свий плеъра</button>
                            <iframe id="modalPlayerIframe" src="${firstEmbedUrl}" allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *; accelerometer; gyroscope" allowfullscreen="true" webkitallowfullscreen="true" mozallowfullscreen="true" playsinline="true" webkit-playsinline="true"></iframe>
                        </div>
                    ` : ""}
                </div>
            `;
        }

        function getMovieIdentifier(item) {
            if (item.slug) {

            if (isTv) {

            if (item.rating) {
                metaHtml = `${metaHtml}<span class="modal-rating-pill">★ ${item.rating}</span>`;
            }
            if (detectCamQuality(item)) {
                metaHtml = `${metaHtml}<span class="modal-type-pill" style="background: rgba(220, 38, 38, 0.25); border: 1px solid rgba(239, 68, 68, 0.6); color: #fca5a5;">⚠️ CAM (Кино запис)</span>`;
            }
            if (itemHasCastPlayer(item)) {
                metaHtml = `${metaHtml}<span class="modal-cast-pill">★ Cast към ТВ</span>`;
            }
            const origins = Array.isArray(item.origins) && item.origins.length > 0 ? item.origins : ["ZenoPlay"];
            for (const orig of origins) {
                const origClass = orig.toLowerCase().replace(/[^a-z0-9]/g, "");
                metaHtml = `${metaHtml}<span class="src-pill src-${origClass}">${orig}</span>`;
            }
            const interStudios = getItemStudios(item);
            for (const st of interStudios) {
                const stCls = st.toLowerCase().replace(/[^a-z0-9]/g, "");
                metaHtml = `${metaHtml}<button type="button" class="crew-search-btn studio-pill studio-${stCls}" data-search-query="@студио: ${escapeHtml(st)}" title="Търси филми от ${escapeHtml(st)}">🏢 ${escapeHtml(st)}</button>`;
            }
            if (intermediateMetaRow) {
                intermediateMetaRow.innerHTML = metaHtml;
            }

            if (intermediateOverview) {
                intermediateOverview.textContent = item.overview || "Няма налично описание.";
            }

            if (intermediateTrailerBtn) {
                intermediateTrailerBtn.style.display = "inline-flex";
                intermediateTrailerBtn.onclick = () => {
                    if (intermediateScreen) {
                        intermediateScreen.classList.remove("open");
                        intermediateScreen.style.display = "none";
                    }
                    openMovieModal(item);
                    setTimeout(() => {
                        const trailerBtn = document.getElementById("modalTrailerBtn");
                        if (trailerBtn) {
                            trailerBtn.click();
                        }
                    }, 350);
                };
            }

            if (intermediateScreen) {
                intermediateScreen.style.display = "flex";
                intermediateScreen.classList.add("open");
            }
            document.body.classList.add("movie-page-active");

            setTimeout(() => {
                if (intermediatePlayBtn) {
                    intermediatePlayBtn.focus();
                }
            }, 60);
        }

        function closeIntermediateScreen(fromPopstate = false) {
            if (!fromPopstate && window.location.hash.startsWith("#movie=")) {
                window.history.back();
                return;
            }
            if (intermediateScreen) {
                intermediateScreen.classList.remove("open");
                intermediateScreen.style.display = "none";
            }
            document.body.classList.remove("movie-page-active");
            state.activeIntermediateItem = null;
            if (typeof state.savedScrollY === "number") {
                window.scrollTo({ top: state.savedScrollY, behavior: "instant" });
            }
            if (state.lastFocusedCardIndex !== null) {
                const prevCard = moviesContainer.querySelector(`.movie-card[data-movie-index="${state.lastFocusedCardIndex}"]`);
                if (prevCard) {
                    prevCard.focus();
                }
            }
        }

        function handleIntermediatePlay() {
            const item = state.activeIntermediateItem;
            if (!item) {
                return;
            }
            if (intermediateScreen) {
                intermediateScreen.classList.remove("open");
                intermediateScreen.style.display = "none";
            }
            openMovieModal(item);
            const box = document.getElementById("mainPlayerFrameBox");
            if (box) {
                setTimeout(() => {
                    enterPlayerFullscreen(box);
                }, 80);
            }
        }

        function handleIntermediateInfo() {
            const item = state.activeIntermediateItem;
            if (!item) {
                return;
            }
            if (intermediateScreen) {
                intermediateScreen.classList.remove("open");
                intermediateScreen.style.display = "none";
            }
            openMovieModal(item);
        }

        function openMovieModal(item) {
            state.savedScrollY = window.scrollY;
            state.activeModalItem = item;
            state.activeSeasonIndex = 0;
            state.activeEpisodeIndex = 0;

            if (window.location.hash !== targetHash) {
                window.history.pushState({ page: "movie", id: movieIdentifier }, "", targetHash);
            }

            const title = escapeHtml(item.title ?? "");
            const poster = escapeHtml(item.poster_url ?? "");
            const backdropStyle = item.backdrop_url
                ? `style="background-image: url('${escapeHtml(item.backdrop_url)}')"`
                : "";

            let genresHtml = "";
            const genres = Array.isArray(item.genres) ? item.genres : [];
            for (const genre of genres) {
                if (`${genre}`.trim().toLowerCase() === "бг аудио") {

                }

            const tags = Array.isArray(item.tags) ? item.tags : [];
            for (const tag of tags) {

            }

            const countries = Array.isArray(item.countries) ? item.countries.join(", ") : "";

            const savedLabel = saved ? "🔖 В списъка „За по-късно“" : "🔖 Добави в „За по-късно“";

            let modalSourcesHtml = "";
            const origins = Array.isArray(item.origins) && item.origins.length > 0 ? item.origins : ["ZenoPlay"];
            for (const orig of origins) {

                modalSourcesHtml = `${modalSourcesHtml}<span class="src-pill src-${origClass}">${orig}</span>`;

            modalBody.innerHTML = `

                    <div class="modal-layout">

                        <div class="modal-info">

                            <div class="modal-submeta">
                                ${typePill}
                                ${hasBgSource(item) ? '<span class="modal-bg-pill">БГ Аудио</span>' : ""}
                                ${itemHasCastPlayer(item) ? '<span class="modal-cast-pill">📺 Cast към TV</span>' : ""}
                                ${item.year ? `<span>📅 ${item.year}</span>` : ""}
                                ${!isTv && item.duration_minutes ? `<span>⏱ ${item.duration_minutes} мин</span>` : ""}
                                ${isTv ? `<span>📺 ${(item.seasons_count || getItemSeasonsCount(item) || 1) === 1 ? "1 сезон" : `${item.seasons_count || getItemSeasonsCount(item) || 1} сезона`}</span>` : ""}
                                ${isTv && (item.total_episodes || getItemEpisodesCount(item)) ? `<span>🎬 ${item.total_episodes || getItemEpisodesCount(item)} епизода</span>` : ""}
                                ${item.rating ? `<span class="modal-rating-pill">★ ${item.rating}</span>` : ""}
                                ${countries ? `<span>🌍 ${escapeHtml(countries)}</span>` : ""}

                                    <div class="modal-crew-chips">
                                        ${item.directors.map(d => `<button type="button" class="crew-search-btn" data-search-query="@режисьор: ${escapeHtml(d)}" title="Търси филми от ${escapeHtml(d)}">${escapeHtml(d)}</button>`).join("")}
                                    </div>
                                    <button type="button" class="modal-expand-btn crew-expand-btn" style="display: none;">още ▾</button>

                            ${Array.isArray(item.actors) && item.actors.length > 0 ? `

                            ${tagsHtml ? `

                            <div class="modal-actions-row">

                    </div>

                <div id="modalPlayerMount">${buildPlayerSectionMarkup(item)}</div>

            movieModal.classList.add("open");

            const topbarTitle = document.getElementById("moviePageTopbarTitle");

        async function enrichModalWithTmdbData(item) {
            let tmdbId = item.tmdb_id ? Number(item.tmdb_id) : null;
            const isTv = item.type === "tv";
            const mediaType = isTv ? "tv" : "movie";

            if (!tmdbId) {
                const searchKey = `${item.title}_${item.year || ""}_${mediaType}`;
                if (tmdbCache.search[searchKey]) {
                    tmdbId = tmdbCache.search[searchKey];
                } else {
                    try {
                        const searchUrl = `https://api.themoviedb.org/3/search/${mediaType}?api_key=${TMDB_API_KEY}&language=bg-BG&query=${encodeURIComponent(item.title)}&include_adult=false`;
                        const sRes = await fetch(searchUrl);
                        if (sRes.ok) {
                            const sData = await sRes.json();
                            if (Array.isArray(sData.results) && sData.results.length > 0) {
                                tmdbId = sData.results[0].id;
                                tmdbCache.search[searchKey] = tmdbId;
                            }
                        }
                    } catch (e) {
                        return;
                    }
                }
            }

            if (!tmdbId) {
                return;
            }

            if (!state.activeModalItem || (state.activeModalItem !== item && state.activeModalItem.id !== item.id)) {
                return;
            }

            let details = null;
            let credits = null;
            let videos = null;

            const cacheKey = `${mediaType}_${tmdbId}`;
            if (tmdbCache.details[cacheKey]) {
                details = tmdbCache.details[cacheKey];
                credits = tmdbCache.credits[cacheKey];
                videos = tmdbCache.videos[cacheKey];
            } else {
                try {
                    const dUrl = `https://api.themoviedb.org/3/${mediaType}/${tmdbId}?api_key=${TMDB_API_KEY}&language=bg-BG&append_to_response=credits,videos,recommendations`;
                    const dRes = await fetch(dUrl);
                    if (dRes.ok) {
                        details = await dRes.json();
                        credits = details.credits || null;
                        videos = details.videos ? details.videos.results : [];

                        if (!videos || videos.length === 0) {
                            const vUrl = `https://api.themoviedb.org/3/${mediaType}/${tmdbId}/videos?api_key=${TMDB_API_KEY}&language=en-US`;
                            const vRes = await fetch(vUrl);
                            if (vRes.ok) {
                                const vData = await vRes.json();
                                videos = vData.results || [];
                            }
                        }

                        tmdbCache.details[cacheKey] = details;
                        tmdbCache.credits[cacheKey] = credits;
                        tmdbCache.videos[cacheKey] = videos;
                    }
                } catch (e) {
                    return;
                }
            }

            if (!state.activeModalItem || (state.activeModalItem !== item && state.activeModalItem.id !== item.id)) {
                return;
            }

            const taglineEl = document.getElementById("modalTagline");
            if (taglineEl && details && details.tagline) {
                taglineEl.textContent = `„${details.tagline}“`;
                taglineEl.style.display = "block";
            }

            let trailerKey = "";
            if (Array.isArray(videos)) {
                for (const v of videos) {
                    if (v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser") && v.key) {
                        trailerKey = v.key;
                        break;
                    }
                }
                if (!trailerKey) {
                    for (const v of videos) {
                        if (v.site === "YouTube" && v.key) {
                            trailerKey = v.key;
                            break;
                        }
                    }
                }
            }

            const trailerBtn = document.getElementById("modalTrailerBtn");
            if (trailerBtn && trailerKey) {
                trailerBtn.style.display = "inline-flex";
                trailerBtn.onclick = () => {
                    playTrailerInModal(trailerKey, details ? details.title || details.name : item.title);
                };
            }

            const castList = credits && Array.isArray(credits.cast) ? credits.cast.slice(0, 20) : [];
            const castSection = document.getElementById("modalCastSection");
            const castScroll = document.getElementById("modalCastScroll");
            if (castSection && castScroll && castList.length > 0) {
                let castHtml = "";
                for (const actor of castList) {
                    const aName = escapeHtml(actor.name || "");
                    const aChar = escapeHtml(actor.character || "");
                    const aPhoto = actor.profile_path ? `https://image.tmdb.org/t/p/w185${actor.profile_path}` : "";
                    castHtml = `${castHtml}
                        <div class="cast-card" data-actor-query="${aName}" title="Търси филми с ${aName}">
                            ${aPhoto ? `<img class="cast-photo" src="${aPhoto}" alt="${aName}" loading="lazy">` : `<div class="cast-photo-fallback">👤</div>`}
                            <div class="cast-name">${aName}</div>
                            ${aChar ? `<div class="cast-character">${aChar}</div>` : ""}
                        </div>
                    `;
                }
                castScroll.innerHTML = castHtml;
                castSection.style.display = "block";

                const allCards = castScroll.querySelectorAll(".cast-card");
                for (const card of allCards) {
                    card.addEventListener("click", () => {
                        const q = card.dataset.actorQuery;
                        if (!q) {
                            return;
                        }
                        closeMovieModal();
                        searchInput.value = `@актьор: ${q}`;
                        searchInput.focus();
                        applyFilters();
                    });
                }
            }

            const recs = details && details.recommendations && Array.isArray(details.recommendations.results) ? details.recommendations.results.slice(0, 12) : [];
            const recSection = document.getElementById("modalRecSection");
            const recScroll = document.getElementById("modalRecScroll");
            if (recSection && recScroll && recs.length > 0) {
                let recHtml = "";
                for (const rec of recs) {
                    const rTitle = escapeHtml(rec.title || rec.name || "");
                    const rPoster = rec.poster_path ? `https://image.tmdb.org/t/p/w342${rec.poster_path}` : "";
                    if (!rPoster) {
                        continue;
                    }
                    const rYear = (rec.release_date || rec.first_air_date || "").slice(0, 4);
                    const rRating = rec.vote_average ? (Math.round(rec.vote_average * 10) / 10).toFixed(1) : "";
                    recHtml = `${recHtml}
                        <div class="rec-card" data-rec-id="${rec.id}" data-rec-type="${rec.media_type || mediaType}">
                            <img class="rec-poster" src="${rPoster}" alt="${rTitle}" loading="lazy">
                            <div class="rec-info">
                                <div class="rec-title">${rTitle}</div>
                                <div class="rec-meta">
                                    <span>${rYear}</span>
                                    ${rRating ? `<span>★ ${rRating}</span>` : ""}
                                </div>
                            </div>
                        </div>
                    `;
                }
                if (recHtml) {
                    recScroll.innerHTML = recHtml;
                    recSection.style.display = "block";

                    const allRecCards = recScroll.querySelectorAll(".rec-card");
                    for (const card of allRecCards) {
                        card.addEventListener("click", () => {
                            const recId = Number(card.dataset.recId);
                            const recType = card.dataset.recType;
                            openTmdbItemById(recId, recType);
                        });
                    }
                }
            }
        }

        async function openTmdbItemById(id, mediaType) {
            for (const item of state.items) {
                if (item.tmdb_id && Number(item.tmdb_id) === Number(id)) {
                    openMovieModal(item);
                    return;
                }
            }

            const mType = mediaType === "tv" ? "tv" : "movie";
            try {
                const url = `https://api.themoviedb.org/3/${mType}/${id}?api_key=${TMDB_API_KEY}&language=bg-BG`;
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    data.media_type = mType;
                    const newItem = createTmdbItemObject(data);
                    openMovieModal(newItem);
                }
            } catch (e) {}
        }

        function handleMovieBack() {
            const box = document.getElementById("mainPlayerFrameBox");
            if (box && (box.classList.contains("theater-mode") || box.classList.contains("is-fullscreen") || document.fullscreenElement || document.webkitFullscreenElement)) {
                exitPlayerFullscreen(box);
                return;
            }
            if (movieModal.classList.contains("open")) {
                closeMovieModal(false);
                return;
            }
            if (intermediateScreen && intermediateScreen.classList.contains("open")) {
                closeIntermediateScreen(false);
                return;
            }
            if (window.location.hash.startsWith("#movie=")) {

        function closeMovieModal(fromPopstate = false) {
            if (!fromPopstate && window.location.hash.startsWith("#movie=")) {
                window.history.back();
                return;
            }
            exitPlayerFullscreen();
            movieModal.classList.remove("open");
            document.body.classList.remove("movie-page-active");

            const topbarTitle = document.getElementById("moviePageTopbarTitle");
            if (topbarTitle) {

        function checkUrlMovieHash() {
            if (!window.location.hash.startsWith("#movie=")) {
                if (movieModal.classList.contains("open")) {
                    closeMovieModal(true);
                }
                if (intermediateScreen && intermediateScreen.classList.contains("open")) {
                    closeIntermediateScreen(true);
                }
                return;
            }
            if (state.activeModalItem || state.activeIntermediateItem) {
                return;
            }
            const rawTarget = decodeURIComponent(window.location.hash.slice(7)).trim();
            if (!rawTarget || !Array.isArray(state.items) || state.items.length === 0) {
                return;
            }
            const target = rawTarget.toLowerCase();
            const foundItem = state.items.find((m) => {
                if (m.slug && m.slug.toLowerCase() === target) {
                    return true;
                }
                if (m.post_id && `${m.post_id}` === target) {
                    return true;
                }
                if (m.title && m.title.toLowerCase() === target) {
                    return true;
                }
                return false;
            });
            if (foundItem) {
                openIntermediateScreen(foundItem);
            }
        }

        function setCatalogItems(itemsList) {
            state.items = itemsList;
            updateTabCounts();
            populateFilterOptions(state.items);
            applyFilters();
            checkUrlMovieHash();
        }

        function normalizeTitleKey(rawTitle) {
            return `${rawTitle ?? ""}`
                .toLowerCase()
                .replace(/\b(?:сезон|част|епизод|part|season|episode)\s*\d+\b/gi, " ")
                .replace(/\b(?:i|ii|iii|iv|v|vi|vii|viii|ix|x)\b/gi, (m) => {
                    const rMap = { i: "1", ii: "2", iii: "3", iv: "4", v: "5", vi: "6", vii: "7", viii: "8", ix: "9", x: "10" };
                    return rMap[m.toLowerCase()] || m;
                })
                .replace(/[^\p{L}\p{N}]+/gu, " ")
                .trim();
        }

        function getTitleMatchingKeys(rawTitle) {
            const keys = new Set();
            if (!rawTitle) {
                return [];
            }
            const fullNorm = normalizeTitleKey(rawTitle);
            if (fullNorm) {
                keys.add(fullNorm);
            }
            const rawStr = `${rawTitle}`;
            if (rawStr.includes("/")) {
                const parts = rawStr.split("/");
                for (let i = 0; i < parts.length; i++) {
                    const pk = normalizeTitleKey(parts[i]);
                    if (pk && pk.length >= 3) {
                        keys.add(pk);
                    }
                }
            }
            if (rawStr.includes(":") || rawStr.includes(" - ")) {
                const prefix = rawStr.split(/[:]|(\s+-\s+)/)[0];
                const pk = normalizeTitleKey(prefix);
                if (pk && pk.length >= 3) {
                    keys.add(pk);
                }
            }
            return Array.from(keys);
        }

        function extractEpisodeInfo(title, origTitle) {
            const patterns = [
                /^(.*?)\s*[-–—:]*\s*S(\d+)\s*E(\d+)\b/i,
                /^(.*?)\s*[-–—:]*\s*Сезон\s*(\d+)\s*[-–—:,]*\s*Епизод\s*(\d+)\b/i,
                /^(.*?)\s*[-–—:]*\s*Season\s*(\d+)\s*[-–—:,]*\s*Episode\s*(\d+)\b/i
            ];
            const candidates = [title || "", origTitle || ""];
            for (const cand of candidates) {
                if (!cand) {
                    continue;
                }
                for (const pat of patterns) {
                    const m = cand.trim().match(pat);
                    if (m) {
                        const baseTitle = m[1].replace(/[-–—:]+$/g, "").trim();
                        const sNum = parseInt(m[2], 10);
                        const eNum = parseInt(m[3], 10);
                        if (baseTitle && !isNaN(sNum) && !isNaN(eNum)) {
                            return { baseTitle, season: sNum, episode: eNum };
                        }
                    }
                }
            }
            return null;
        }

        function detectItemType(item) {
            if (item.type === "tv") {
                return "tv";
            }
            if (Array.isArray(item.seasons) && item.seasons.length > 0) {
                return "tv";
            }
            const title = item.title || "";
            if (/(?:S\d+E\d+|сезон\s*\d+|епизод\s*\d+|season\s*\d+|ep\.\s*\d+)/i.test(title)) {
                return "tv";
            }
            return "movie";
        }

        function mergeFilmi2kCatalog(combined, filmi2kRaw, sourceName = "Filmi2k") {
            if (!Array.isArray(filmi2kRaw) || filmi2kRaw.length === 0) {
                return;
            }

            const byTitleYear = new Map();
            const byTitleOnly = new Map();
            const byOrigYear = new Map();
            const byOrigOnly = new Map();

            for (const item of combined) {
                const tKeys = getTitleMatchingKeys(item.title);
                for (let i = 0; i < tKeys.length; i++) {
                    const tKey = tKeys[i];
                    if (item.year) {
                        byTitleYear.set(`${tKey}|${item.year}`, item);
                    }
                    if (!byTitleOnly.has(tKey)) {
                        byTitleOnly.set(tKey, item);
                    }
                }
                const oKeys = getTitleMatchingKeys(item.original_title);
                for (let i = 0; i < oKeys.length; i++) {
                    const oKey = oKeys[i];
                    if (item.year) {
                        byOrigYear.set(`${oKey}|${item.year}`, item);
                    }
                    if (!byOrigOnly.has(oKey)) {
                        byOrigOnly.set(oKey, item);
                    }
                }
            }

            for (const fItem of filmi2kRaw) {
                if (!fItem || typeof fItem !== "object") {
                    continue;
                }
                const fSources = Array.isArray(fItem.player_sources) ? [...fItem.player_sources] : [];
                if (fSources.length === 0 && fItem.url) {
                    fSources.push({
                        id: `${sourceName.toLowerCase()}-site-ext`,
                        name: `🌐 ${sourceName} (Сайт)`,
                        group: fItem.is_subtitled ? "sub" : "bg",
                        direct_embed: false,
                        embed_url: fItem.url
                    });
                }
                if (fSources.length === 0 && !fItem.url) {
                    continue;
                }

                const tKeys = getTitleMatchingKeys(fItem.title);
                const oKeys = getTitleMatchingKeys(fItem.original_title);
                let matched = null;
                if (fItem.year) {
                    for (let i = 0; i < tKeys.length; i++) {
                        matched = byTitleYear.get(`${tKeys[i]}|${fItem.year}`) ?? null;
                        if (matched) {
                            break;
                        }
                    }
                }
                if (!matched && fItem.year) {
                    for (let i = 0; i < oKeys.length; i++) {
                        matched = byOrigYear.get(`${oKeys[i]}|${fItem.year}`) ?? null;
                        if (matched) {
                            break;
                        }
                    }
                }
                if (!matched) {
                    for (let i = 0; i < tKeys.length; i++) {
                        const cand = byTitleOnly.get(tKeys[i]) ?? null;
                        if (cand) {
                            if (!fItem.year || !cand.year || Math.abs(Number(cand.year) - Number(fItem.year)) <= 2) {
                                matched = cand;
                                break;
                            }
                        }
                    }
                }
                if (!matched) {
                    for (let i = 0; i < oKeys.length; i++) {
                        const cand = byOrigOnly.get(oKeys[i]) ?? null;
                        if (cand) {
                            if (!fItem.year || !cand.year || Math.abs(Number(cand.year) - Number(fItem.year)) <= 2) {
                                matched = cand;
                                break;
                            }
                        }
                    }
                }

                if (matched) {
                    const existingSources = Array.isArray(matched.player_sources) ? matched.player_sources : [];
                    const existingUrls = new Set();
                    for (const es of existingSources) {
                        if (es.embed_url) {
                            existingUrls.add(es.embed_url);
                        }
                    }
                    const toPrepend = [];
                    for (const fs of fSources) {
                        if (fs.embed_url && !existingUrls.has(fs.embed_url)) {
                            toPrepend.push({
                                ...fs,
                                direct_embed: fs.direct_embed !== undefined ? fs.direct_embed : (sourceName === "Filmizip" ? false : true)
                            });
                        }
                    }
                    matched.player_sources = [...toPrepend, ...existingSources];
                    if (fItem.is_subtitled) {
                        matched.is_subtitled = true;
                    }
                    if (fItem.is_bg_audio !== false && !fItem.is_subtitled) {
                        matched.is_bg_audio = true;
                    }
                    if (sourceName === "Filmi2k" && !fItem.is_subtitled) {
                        matched.has_filmi2k_bg = true;
                    }
                    if (!Array.isArray(matched.origins)) {
                        matched.origins = ["ZenoPlay"];
                    }
                    if (!matched.tmdb_id && fItem.tmdb_id) {
                        matched.tmdb_id = fItem.tmdb_id;
                    }
                    if (!matched.origins.includes(sourceName)) {
                        matched.origins.push(sourceName);
                    }
                    if (sourceName === "Filmi2k" && fItem.url) {
                        matched.filmi2k_url = fItem.url;
                    }
                    if (sourceName === "Filmizip" && fItem.url) {
                        matched.filmizip_url = fItem.url;
                    }
                    if (sourceName === "Filmifen" && fItem.url) {
                        matched.filmifen_url = fItem.url;
                    }
                    if (sourceName === "Filmi9" && fItem.url) {
                        matched.filmi9_url = fItem.url;
                    }
                    if (fItem.original_title && !matched.original_title) {
                        matched.original_title = fItem.original_title;
                    }
                    if (Array.isArray(fItem.actors) && fItem.actors.length > 0) {
                        const hasCyrF = fItem.actors.some(a => /[\u0400-\u04FF]/.test(a));
                        const hasCyrM = Array.isArray(matched.actors) && matched.actors.some(a => /[\u0400-\u04FF]/.test(a));
                        if (!Array.isArray(matched.actors) || matched.actors.length === 0 || (hasCyrF && !hasCyrM) || (hasCyrF && fItem.actors.length >= matched.actors.length)) {
                            matched.actors = fItem.actors;
                        }
                    }
                    if (Array.isArray(fItem.directors) && fItem.directors.length > 0) {
                        const hasCyrF = fItem.directors.some(d => /[\u0400-\u04FF]/.test(d));
                        const hasCyrM = Array.isArray(matched.directors) && matched.directors.some(d => /[\u0400-\u04FF]/.test(d));
                        if (!Array.isArray(matched.directors) || matched.directors.length === 0 || (hasCyrF && !hasCyrM) || (hasCyrF && fItem.directors.length >= matched.directors.length)) {
                            matched.directors = fItem.directors;
                        }
                    }
                    if (fItem.overview && !matched.overview) {
                        matched.overview = fItem.overview;
                    }
                    const mGenres = Array.isArray(matched.genres) ? matched.genres : [];
                    const langGenre = fItem.is_subtitled ? "БГ Субтитри" : "БГ Аудио";
                    if (!mGenres.includes(langGenre)) {
                        mGenres.push(langGenre);
                        matched.genres = mGenres;
                    }
                    continue;
                }

                const epInfo = extractEpisodeInfo(fItem.title, fItem.original_title);
                if (epInfo) {
                    const bTKey = normalizeTitleKey(epInfo.baseTitle);
                    let seriesMatched = byTitleOnly.get(bTKey) ?? null;
                    const epOrigInfo = extractEpisodeInfo(fItem.original_title, "");
                    const origBase = epOrigInfo ? epOrigInfo.baseTitle : (fItem.original_title || "");
                    const bOKey = origBase ? normalizeTitleKey(origBase) : null;
                    if (!seriesMatched && bOKey) {
                        seriesMatched = byOrigOnly.get(bOKey) ?? byTitleOnly.get(bOKey) ?? null;
                    }

                    if (!seriesMatched) {
                        seriesMatched = {
                            type: "tv",
                            title: epInfo.baseTitle,
                            original_title: origBase,
                            year: fItem.year,
                            poster_url: fItem.poster_url,
                            backdrop_url: fItem.backdrop_url,
                            overview: fItem.overview,
                            genres: Array.isArray(fItem.genres) && fItem.genres.length > 0 ? [...fItem.genres] : ["Сериал"],
                            origins: [sourceName],
                            is_bg_audio: true,
                            has_filmi2k_bg: sourceName === "Filmi2k",
                            seasons: [],
                            player_sources: []
                        };
                        if (!seriesMatched.genres.includes("Сериал")) {
                            seriesMatched.genres.push("Сериал");
                        }
                        if (!seriesMatched.genres.includes("БГ Аудио")) {
                            seriesMatched.genres.push("БГ Аудио");
                        }
                        combined.push(seriesMatched);
                        byTitleOnly.set(bTKey, seriesMatched);
                        if (bOKey) {
                            byOrigOnly.set(bOKey, seriesMatched);
                        }
                    }

                    seriesMatched.type = "tv";
                    seriesMatched.is_bg_audio = true;
                    if (!Array.isArray(seriesMatched.origins)) {
                        seriesMatched.origins = ["ZenoPlay"];
                    }
                    if (!seriesMatched.origins.includes(sourceName)) {
                        seriesMatched.origins.push(sourceName);
                    }
                    if (sourceName === "Filmi2k") {
                        seriesMatched.has_filmi2k_bg = true;
                    }
                    const mGenres = Array.isArray(seriesMatched.genres) ? seriesMatched.genres : [];
                    if (!mGenres.includes("БГ Аудио")) {
                        mGenres.push("БГ Аудио");
                        seriesMatched.genres = mGenres;
                    }

                    if (!Array.isArray(seriesMatched.seasons)) {
                        seriesMatched.seasons = [];
                    }
                    let sObj = seriesMatched.seasons.find(s => (s.season_number ?? s.season) === epInfo.season);
                    if (!sObj) {
                        sObj = { season: epInfo.season, season_number: epInfo.season, episodes: [] };
                        seriesMatched.seasons.push(sObj);
                        seriesMatched.seasons.sort((a, b) => (a.season_number ?? a.season) - (b.season_number ?? b.season));
                    }
                    if (!Array.isArray(sObj.episodes)) {
                        sObj.episodes = [];
                    }
                    let eObj = sObj.episodes.find(e => (e.episode_number ?? e.episode) === epInfo.episode);
                    if (!eObj) {
                        eObj = { episode: epInfo.episode, episode_number: epInfo.episode, title: fItem.title, player_sources: [] };
                        sObj.episodes.push(eObj);
                        sObj.episodes.sort((a, b) => (a.episode_number ?? a.episode) - (b.episode_number ?? b.episode));
                    }
                    if (!Array.isArray(eObj.player_sources)) {
                        eObj.player_sources = [];
                    }
                    for (const fs of fSources) {
                        if (fs.embed_url && !eObj.player_sources.some(p => p.embed_url === fs.embed_url)) {
                            eObj.player_sources.push({
                                ...fs,
                                direct_embed: fs.direct_embed !== undefined ? fs.direct_embed : true,
                                group: "bg"
                            });
                        }
                    }
                    eObj.has_bg = true;

                    if (!Array.isArray(seriesMatched.player_sources)) {
                        seriesMatched.player_sources = [];
                    }
                    for (const fs of fSources) {
                        if (fs.embed_url && !seriesMatched.player_sources.some(p => p.embed_url === fs.embed_url)) {
                            seriesMatched.player_sources.push({
                                ...fs,
                                season: epInfo.season,
                                episode: epInfo.episode,
                                direct_embed: fs.direct_embed !== undefined ? fs.direct_embed : true,
                                group: "bg"
                            });
                        }
                    }

                    seriesMatched.seasons_count = seriesMatched.seasons.length;
                    let epCount = 0;
                    for (const s of seriesMatched.seasons) {
                        if (Array.isArray(s.episodes)) {
                            epCount += s.episodes.length;
                        }
                    }
                    seriesMatched.total_episodes = Math.max(seriesMatched.total_episodes || 0, epCount);
                    continue;
                }

                const resolvedType = fItem.type ?? detectItemType(fItem);
                const isSub = Boolean(fItem.is_subtitled) || (Array.isArray(fItem.genres) && fItem.genres.includes("БГ Субтитри"));
                const isBg = fItem.is_bg_audio !== undefined ? Boolean(fItem.is_bg_audio) : !isSub;
                combined.push({
                    ...fItem,
                    type: resolvedType,
                    is_bg_audio: isBg,
                    is_subtitled: isSub,
                    has_filmi2k_bg: sourceName === "Filmi2k" && isBg,
                    player_sources: fSources,
                    origins: [sourceName]
                });
            }
        }

                script.onload = () => resolve(true);
                script.onerror = () => resolve(false);
                document.body.appendChild(script);
            });
        }

            const trigger = val[0];

                activeSuggestionIndex = (activeSuggestionIndex + 1) % currentSuggestions.length;
                updateSuggestionHighlight();

                event.preventDefault();
                activeSuggestionIndex = (activeSuggestionIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
                updateSuggestionHighlight();
                return;

            if (event.key === "Enter" || event.key === "Tab") {
                if (activeSuggestionIndex >= 0 && activeSuggestionIndex < currentSuggestions.length) {
                    event.preventDefault();
                    selectSuggestion(activeSuggestionIndex, trigger);

        function exitPlayerFullscreen(box) {
            const targetBox = box || document.getElementById("mainPlayerFrameBox");
            if (targetBox) {
                targetBox.classList.remove("theater-mode");
                targetBox.classList.remove("is-fullscreen");
            }
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                try {
                    const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                    if (exitFn) {
                        exitFn.call(document).catch(() => {});
                    }
                } catch (e) {}
            }
            updateTheaterButtonsState(false);
        }

        function enterPlayerFullscreen(box) {
            if (!box) {
                return;
            }
            if (box.classList.contains("theater-mode") || box.classList.contains("is-fullscreen")) {
                exitPlayerFullscreen(box);
                return;
            }
            const req = box.requestFullscreen || box.webkitRequestFullscreen || box.mozRequestFullScreen || box.msRequestFullscreen;
            if (req) {
                try {
                    const promise = req.call(box);
                    if (promise && typeof promise.catch === "function") {
                        promise.then(() => {
                            box.classList.add("is-fullscreen");
                            updateTheaterButtonsState(true);
                        }).catch(() => {
                            box.classList.add("theater-mode");
                            updateTheaterButtonsState(true);
                        });
                    } else {
                        box.classList.add("is-fullscreen");
                        updateTheaterButtonsState(true);
                    }
                } catch (err) {
                    box.classList.add("theater-mode");
                    updateTheaterButtonsState(true);
                }
                return;
            }
            box.classList.add("theater-mode");
            updateTheaterButtonsState(true);
        }

        const fullscreenEvents = ["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"];
        for (const evt of fullscreenEvents) {
            document.addEventListener(evt, () => {
                const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
                const box = document.getElementById("mainPlayerFrameBox");
                if (box) {
                    box.classList.toggle("is-fullscreen", isFs);
                    if (!isFs) {

                event.keyCode === 10009 ||
                event.keyCode === 461;

            if (isBackKey) {
                const box = document.getElementById("mainPlayerFrameBox");
                if (box && (box.classList.contains("theater-mode") || box.classList.contains("is-fullscreen") || document.fullscreenElement || document.webkitFullscreenElement)) {
                    event.preventDefault();
                    event.stopPropagation();
                    exitPlayerFullscreen(box);
                    return;
                }
                if (movieModal.classList.contains("open") || (intermediateScreen && intermediateScreen.classList.contains("open"))) {
                    event.preventDefault();
                    event.stopPropagation();
                    handleMovieBack();
                }
            }
        });

        modalBody.addEventListener("click", (event) => {
            const crewBtn = event.target.closest(".crew-search-btn");
            if (crewBtn) {
                const query = crewBtn.getAttribute("data-search-query");
                if (query) {
                    handleMovieBack();
                    searchInput.value = query;
                    state.searchQuery = query;
                    applyFilters();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                }
            }
        });

        const scrollTopBtn = document.getElementById("scrollTopBtn");
        if (scrollTopBtn) {
            window.addEventListener("scroll", () => {
                scrollTopBtn.classList.toggle("visible", window.scrollY > 350);
            }, { passive: true });
            scrollTopBtn.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }

        loadInitialData();
        checkUrlMovieHash();
    </script>
</body>
</html>
