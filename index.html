        function normalizeTitleKey(rawTitle) {
            return `${rawTitle ?? ""}`
                .toLowerCase()
                .replace(/[^\p{L}\p{N}]+/gu, " ")
                .trim();
        }

        function extractEpisodeInfo(title, origTitle) {
            const patterns = [
                /^(.*?)\s*[-–—:]*\s*S(\d+)\s*E(\d+)\b/i,
                /^(.*?)\s*[-–—:]*\s*Сезон\s*(\d+)\s*[-–—:,]*\s*Епизод\s*(\d+)\b/i,
                /^(.*?)\s*[-–—:]*\s*Season\s*(\d+)\s*[-–—:,]*\s*Episode\s*(\d+)\b/i
            ];
            const candidates = [title || "", origTitle || ""];
            for (const cand of candidates) {
                if (!cand) {
                    continue;
                }
                for (const pat of patterns) {
                    const m = cand.trim().match(pat);
                    if (m) {
                        const baseTitle = m[1].replace(/[-–—:]+$/g, "").trim();
                        const sNum = parseInt(m[2], 10);
                        const eNum = parseInt(m[3], 10);
                        if (baseTitle && !isNaN(sNum) && !isNaN(eNum)) {
                            return { baseTitle, season: sNum, episode: eNum };
                        }
                    }
                }
            }
            return null;
        }

        function detectItemType(item) {
            if (item.type === "tv") {
                return "tv";
            }
            if (Array.isArray(item.seasons) && item.seasons.length > 0) {
                return "tv";
            }
            const title = item.title || "";
            if (/(?:S\d+E\d+|сезон\s*\d+|епизод\s*\d+|season\s*\d+|ep\.\s*\d+)/i.test(title)) {
                return "tv";
            }
            return "movie";
        }

        function mergeFilmi2kCatalog(combined, filmi2kRaw, sourceName = "Filmi2k") {
            if (!Array.isArray(filmi2kRaw) || filmi2kRaw.length === 0) {
                return;
            }

            const byTitleYear = new Map();
            const byTitleOnly = new Map();
            const byOrigYear = new Map();
            const byOrigOnly = new Map();

            for (const item of combined) {
                const tKey = normalizeTitleKey(item.title);
                if (tKey) {
                    if (item.year) {
                        byTitleYear.set(`${tKey}|${item.year}`, item);
                    }
                    if (!byTitleOnly.has(tKey)) {
                        byTitleOnly.set(tKey, item);
                    }
                }
                const oKey = normalizeTitleKey(item.original_title);
                if (oKey) {
                    if (item.year) {
                        byOrigYear.set(`${oKey}|${item.year}`, item);
                    }
                    if (!byOrigOnly.has(oKey)) {
                        byOrigOnly.set(oKey, item);
                    }
                }
            }

            for (const fItem of filmi2kRaw) {
                if (!fItem || typeof fItem !== "object") {
                    continue;
                }
                const fSources = Array.isArray(fItem.player_sources) ? fItem.player_sources : [];
                if (fSources.length === 0) {
                    continue;
                }

                const tKey = normalizeTitleKey(fItem.title);
                const oKey = normalizeTitleKey(fItem.original_title);
                let matched = null;
                if (tKey && fItem.year) {
                    matched = byTitleYear.get(`${tKey}|${fItem.year}`) ?? null;
                }
                if (!matched && oKey && fItem.year) {
                    matched = byOrigYear.get(`${oKey}|${fItem.year}`) ?? null;
                }
                if (!matched && tKey) {
                    matched = byTitleOnly.get(tKey) ?? null;
                }
                if (!matched && oKey) {
                    matched = byOrigOnly.get(oKey) ?? null;
                }
                if (matched && fItem.year && matched.year && Math.abs(Number(matched.year) - Number(fItem.year)) > 1) {
                    matched = null;
                }

                if (matched) {
                    const existingSources = Array.isArray(matched.player_sources) ? matched.player_sources : [];
                    const existingUrls = new Set();
                    for (const es of existingSources) {
                        if (es.embed_url) {
                            existingUrls.add(es.embed_url);
                        }
                    }
                    const toPrepend = [];
                    for (const fs of fSources) {
                        if (fs.embed_url && !existingUrls.has(fs.embed_url)) {
                            toPrepend.push({
                                ...fs,
                                direct_embed: fs.direct_embed !== undefined ? fs.direct_embed : (sourceName === "Filmizip" ? false : true)
                            });
                        }
                    }
                    matched.player_sources = [...toPrepend, ...existingSources];
                    if (fItem.is_subtitled) {
                        matched.is_subtitled = true;
                    }
                    if (fItem.is_bg_audio !== false && !fItem.is_subtitled) {
                        matched.is_bg_audio = true;
                    }
                    if (sourceName === "Filmi2k" && !fItem.is_subtitled) {
                        matched.has_filmi2k_bg = true;
                    }
                    if (!Array.isArray(matched.origins)) {
                        matched.origins = ["ZenoPlay"];
                    }
                    if (!matched.origins.includes(sourceName)) {
                        matched.origins.push(sourceName);
                    }
                    if (sourceName === "Filmi2k" && fItem.url) {
                        matched.filmi2k_url = fItem.url;
                    }
                    if (sourceName === "Filmizip" && fItem.url) {
                        matched.filmizip_url = fItem.url;
                    }
                    if (sourceName === "Filmifen" && fItem.url) {
                        matched.filmifen_url = fItem.url;
                    }
                    if (sourceName === "Filmi9" && fItem.url) {
                        matched.filmi9_url = fItem.url;
                    }
                    if (fItem.original_title && !matched.original_title) {
                        matched.original_title = fItem.original_title;
                    }
                    if (Array.isArray(fItem.actors) && fItem.actors.length > 0) {
                        const hasCyrF = fItem.actors.some(a => /[\u0400-\u04FF]/.test(a));
                        const hasCyrM = Array.isArray(matched.actors) && matched.actors.some(a => /[\u0400-\u04FF]/.test(a));
                        if (!Array.isArray(matched.actors) || matched.actors.length === 0 || (hasCyrF && !hasCyrM) || (hasCyrF && fItem.actors.length >= matched.actors.length)) {
                            matched.actors = fItem.actors;
                        }
                    }
                    if (Array.isArray(fItem.directors) && fItem.directors.length > 0) {
                        const hasCyrF = fItem.directors.some(d => /[\u0400-\u04FF]/.test(d));
                        const hasCyrM = Array.isArray(matched.directors) && matched.directors.some(d => /[\u0400-\u04FF]/.test(d));
                        if (!Array.isArray(matched.directors) || matched.directors.length === 0 || (hasCyrF && !hasCyrM) || (hasCyrF && fItem.directors.length >= matched.directors.length)) {
                            matched.directors = fItem.directors;
                        }
                    }
                    if (fItem.overview && !matched.overview) {
                        matched.overview = fItem.overview;
                    }
                    const mGenres = Array.isArray(matched.genres) ? matched.genres : [];
                    const langGenre = fItem.is_subtitled ? "БГ Субтитри" : "БГ Аудио";
                    if (!mGenres.includes(langGenre)) {
                        mGenres.push(langGenre);
                        matched.genres = mGenres;
                    }
                    continue;
                }

                const epInfo = extractEpisodeInfo(fItem.title, fItem.original_title);
                if (epInfo) {
                    const bTKey = normalizeTitleKey(epInfo.baseTitle);
                    let seriesMatched = byTitleOnly.get(bTKey) ?? null;
                    const epOrigInfo = extractEpisodeInfo(fItem.original_title, "");
                    const origBase = epOrigInfo ? epOrigInfo.baseTitle : (fItem.original_title || "");
                    const bOKey = origBase ? normalizeTitleKey(origBase) : null;
                    if (!seriesMatched && bOKey) {
                        seriesMatched = byOrigOnly.get(bOKey) ?? byTitleOnly.get(bOKey) ?? null;
                    }

                    if (!seriesMatched) {
                        seriesMatched = {
                            type: "tv",
                            title: epInfo.baseTitle,
                            original_title: origBase,
                            year: fItem.year,
                            poster_url: fItem.poster_url,
                            backdrop_url: fItem.backdrop_url,
                            overview: fItem.overview,
                            genres: Array.isArray(fItem.genres) && fItem.genres.length > 0 ? [...fItem.genres] : ["Сериал"],
                            origins: [sourceName],
                            is_bg_audio: true,
                            has_filmi2k_bg: sourceName === "Filmi2k",
                            seasons: [],
                            player_sources: []
                        };
                        if (!seriesMatched.genres.includes("Сериал")) {
                            seriesMatched.genres.push("Сериал");
                        }
                        if (!seriesMatched.genres.includes("БГ Аудио")) {
                            seriesMatched.genres.push("БГ Аудио");
                        }
                        combined.push(seriesMatched);
                        byTitleOnly.set(bTKey, seriesMatched);
                        if (bOKey) {
                            byOrigOnly.set(bOKey, seriesMatched);
                        }
                    }

                    seriesMatched.type = "tv";
                    seriesMatched.is_bg_audio = true;
                    if (!Array.isArray(seriesMatched.origins)) {
                        seriesMatched.origins = ["ZenoPlay"];
                    }
                    if (!seriesMatched.origins.includes(sourceName)) {
                        seriesMatched.origins.push(sourceName);
                    }
                    if (sourceName === "Filmi2k") {
                        seriesMatched.has_filmi2k_bg = true;
                    }
                    const mGenres = Array.isArray(seriesMatched.genres) ? seriesMatched.genres : [];
                    if (!mGenres.includes("БГ Аудио")) {
                        mGenres.push("БГ Аудио");
                        seriesMatched.genres = mGenres;
                    }

                    if (!Array.isArray(seriesMatched.seasons)) {
                        seriesMatched.seasons = [];
                    }
                    let sObj = seriesMatched.seasons.find(s => (s.season_number ?? s.season) === epInfo.season);
                    if (!sObj) {
                        sObj = { season: epInfo.season, season_number: epInfo.season, episodes: [] };
                        seriesMatched.seasons.push(sObj);
                        seriesMatched.seasons.sort((a, b) => (a.season_number ?? a.season) - (b.season_number ?? b.season));
                    }
                    if (!Array.isArray(sObj.episodes)) {
                        sObj.episodes = [];
                    }
                    let eObj = sObj.episodes.find(e => (e.episode_number ?? e.episode) === epInfo.episode);
                    if (!eObj) {
                        eObj = { episode: epInfo.episode, episode_number: epInfo.episode, title: fItem.title, player_sources: [] };
                        sObj.episodes.push(eObj);
                        sObj.episodes.sort((a, b) => (a.episode_number ?? a.episode) - (b.episode_number ?? b.episode));
                    }
                    if (!Array.isArray(eObj.player_sources)) {
                        eObj.player_sources = [];
                    }
                    for (const fs of fSources) {
                        if (fs.embed_url && !eObj.player_sources.some(p => p.embed_url === fs.embed_url)) {
                            eObj.player_sources.push({
                                ...fs,
                                direct_embed: fs.direct_embed !== undefined ? fs.direct_embed : true,
                                group: "bg"
                            });
                        }
                    }
                    eObj.has_bg = true;

                    if (!Array.isArray(seriesMatched.player_sources)) {
                        seriesMatched.player_sources = [];
                    }
                    for (const fs of fSources) {
                        if (fs.embed_url && !seriesMatched.player_sources.some(p => p.embed_url === fs.embed_url)) {
                            seriesMatched.player_sources.push({
                                ...fs,
                                season: epInfo.season,
                                episode: epInfo.episode,
                                direct_embed: fs.direct_embed !== undefined ? fs.direct_embed : true,
                                group: "bg"
                            });
                        }
                    }

                    seriesMatched.seasons_count = seriesMatched.seasons.length;
                    let epCount = 0;
                    for (const s of seriesMatched.seasons) {
                        if (Array.isArray(s.episodes)) {
                            epCount += s.episodes.length;
                        }
                    }
                    seriesMatched.total_episodes = Math.max(seriesMatched.total_episodes || 0, epCount);
                    continue;
                }

                const resolvedType = fItem.type ?? detectItemType(fItem);
                const isSub = Boolean(fItem.is_subtitled) || (Array.isArray(fItem.genres) && fItem.genres.includes("БГ Субтитри"));
                const isBg = fItem.is_bg_audio !== undefined ? Boolean(fItem.is_bg_audio) : !isSub;
                combined.push({
                    ...fItem,
                    type: resolvedType,
                    is_bg_audio: isBg,
                    is_subtitled: isSub,
                    has_filmi2k_bg: sourceName === "Filmi2k" && isBg,
                    origins: [sourceName]
                });
            }
        }

        function loadScriptAsync(src) {
            return new Promise((resolve) => {
                const script = document.createElement("script");
                script.src = src;
                script.async = true;
                script.onload = () => resolve(true);
                script.onerror = () => resolve(false);
                document.body.appendChild(script);
            });
        }

        async function loadRemainingCatalogsProgressive(combined) {
            const v = "20261113_v4";

            // 1. Load TV Shows
            await loadScriptAsync(`data/tv_shows_data.js?v=${v}`);
            if (Array.isArray(window.TV_SHOWS_DATA) && window.TV_SHOWS_DATA.length > 0) {
                const tvShows = normalizeItemsPayload(window.TV_SHOWS_DATA, "tv", "ZenoPlay");
                for (const tv of tvShows) {
                    combined.push(tv);
                }
                updateTabCounts();
            }

            // 2. Load Filmizip
            await loadScriptAsync(`data/filmizip_bg_data.js?v=${v}`);
            if (Array.isArray(window.FILMIZIP_BG_DATA) && window.FILMIZIP_BG_DATA.length > 0) {
                mergeFilmi2kCatalog(combined, window.FILMIZIP_BG_DATA, "Filmizip");
                updateTabCounts();
            }

            // 3. Load Filmi2k
            await loadScriptAsync(`data/filmi2k_bg_data.js?v=${v}`);
            if (Array.isArray(window.FILMI2K_BG_DATA) && window.FILMI2K_BG_DATA.length > 0) {
                mergeFilmi2kCatalog(combined, window.FILMI2K_BG_DATA, "Filmi2k");
                updateTabCounts();
            }

            // 4. Load Filmifen
            await loadScriptAsync(`data/filmifen_bg_data.js?v=${v}`);
            if (Array.isArray(window.FILMIFEN_BG_DATA) && window.FILMIFEN_BG_DATA.length > 0) {
                mergeFilmi2kCatalog(combined, window.FILMIFEN_BG_DATA, "Filmifen");
                updateTabCounts();
            }

            // 5. Load BG Serials
            await loadScriptAsync(`data/bg_serials_data.js?v=${v}`);
            if (Array.isArray(window.BG_SERIALS_DATA) && window.BG_SERIALS_DATA.length > 0) {
                mergeFilmi2kCatalog(combined, window.BG_SERIALS_DATA, "Filmizip");
                updateTabCounts();
            }

            // 6. Load Subtitled Movies
            await loadScriptAsync(`data/subtitled_movies_data.js?v=${v}`);
            if (Array.isArray(window.SUBTITLED_MOVIES_DATA) && window.SUBTITLED_MOVIES_DATA.length > 0) {
                mergeFilmi2kCatalog(combined, window.SUBTITLED_MOVIES_DATA, "Filmizip");
                updateTabCounts();
            }

            await loadScriptAsync(`data/filmi2k_sub_data.js?v=${v}`);
            if (Array.isArray(window.FILMI2K_SUB_DATA) && window.FILMI2K_SUB_DATA.length > 0) {
                mergeFilmi2kCatalog(combined, window.FILMI2K_SUB_DATA, "Filmi2k");
                updateTabCounts();
            }

            // 7. Load Filmi9 Movies
            await loadScriptAsync(`data/filmi9_data.js?v=${v}`);
            if (Array.isArray(window.FILMI9_DATA) && window.FILMI9_DATA.length > 0) {
                mergeFilmi2kCatalog(combined, window.FILMI9_DATA, "Filmi9");
                updateTabCounts();
            }

            // Final refresh: update filter dropdowns and re-apply filters so the full catalog is visible
            updateTabCounts();
            populateFilterOptions(state.items);
            applyFilters();
        }

        async function loadInitialData() {
            loadWatchlistFromStorage();
            loadFiltersFromStorage();
            updateDurationSelectOptions();
            updateEpisodesFilterVisibility();
            const combined = [];

            // Fast Initial Render: load movies from movies_data.js (<1s)
            if (Array.isArray(window.MOVIES_DATA) && window.MOVIES_DATA.length > 0) {
                const movies = normalizeItemsPayload(window.MOVIES_DATA, "movie", "ZenoPlay");
                for (const m of movies) {
                    combined.push(m);
                }
            }

            // Display initial grid immediately
            setCatalogItems(combined);

            // Progressively load remaining secondary catalogs without freezing UI
            setTimeout(() => {
                loadRemainingCatalogsProgressive(combined);
            }, 60);
        }

        searchInput.addEventListener("input", () => {
            const val = searchInput.value;
            if (val.startsWith("#") || val.startsWith("@")) {
                const trigger = val[0];
                const after = val.slice(1);
                if (!after.includes(" ")) {
                    const filterTerm = after.replace(":", "").trim();
                    if (activeSuggestionIndex < 0) {
                        activeSuggestionIndex = 0;
                    }
                    renderSearchSuggestions(trigger, filterTerm);
                } else {
                    hideSearchSuggestions();
                }
            } else {
                hideSearchSuggestions();
            }
            applyFilters();
        });

        searchInput.addEventListener("keydown", (event) => {
            if (searchSuggestions.style.display === "none" || currentSuggestions.length === 0) {
                return;
            }

            const trigger = searchInput.value.startsWith("@") ? "@" : "#";

            if (event.key === "ArrowDown") {
                event.preventDefault();
                activeSuggestionIndex = (activeSuggestionIndex + 1) % currentSuggestions.length;
                updateSuggestionHighlight();
                return;
            }

            if (event.key === "ArrowUp") {
                event.preventDefault();
                activeSuggestionIndex = (activeSuggestionIndex - 1 + currentSuggestions.length) % currentSuggestions.length;
                updateSuggestionHighlight();
                return;
            }

            if (event.key === "Enter" || event.key === "Tab") {
                if (activeSuggestionIndex >= 0 && activeSuggestionIndex < currentSuggestions.length) {
                    event.preventDefault();
                    selectSuggestion(activeSuggestionIndex, trigger);
                }
                return;
            }

            if (event.key === "Escape") {
                event.preventDefault();
                hideSearchSuggestions();
                return;
            }
        });

        searchSuggestions.addEventListener("click", (event) => {
            const itemEl = event.target.closest(".search-suggestion-item");
            if (!itemEl) {
                return;
            }
            const idx = parseInt(itemEl.dataset.index, 10);
            const trigger = searchInput.value.startsWith("@") ? "@" : "#";
            selectSuggestion(idx, trigger);
        });

        document.addEventListener("click", (event) => {
            if (!searchInput.contains(event.target) && !searchSuggestions.contains(event.target)) {
                hideSearchSuggestions();
            }
        });
        yearFromSelect.addEventListener("change", applyFilters);
        yearToSelect.addEventListener("change", applyFilters);
        if (durationSelect) {
            durationSelect.addEventListener("change", applyFilters);
        }
        playerSelect.addEventListener("change", applyFilters);
        sourceSelect.addEventListener("change", () => {
            if (sourceSelect.value && state.typeFilter === "unique") {
                state.uniqueSiteFilter = sourceSelect.value;
                updateTabCounts();
            }
            applyFilters();
        });
        sortSelect.addEventListener("change", applyFilters);

        if (uniqueOnlyCheckbox) {
            uniqueOnlyCheckbox.addEventListener("change", () => {
                state.uniqueOnly = Boolean(uniqueOnlyCheckbox.checked);
                updateTabCounts();
                applyFilters();
            });
        }

        if (uniqueSitesBar) {
            uniqueSitesBar.addEventListener("click", (event) => {
                const btn = event.target.closest(".unique-site-btn");
                if (!btn) {
                    return;
                }
                const site = btn.dataset.site;
                state.uniqueSiteFilter = site === "all" ? "" : site;
                if (sourceSelect && site !== "all") {
                    sourceSelect.value = site;
                }
                updateTabCounts();
                applyFilters();
            });
        }

        if (audioSubFilterSelect) {
            audioSubFilterSelect.addEventListener("change", () => {
                state.audioSubFilter = audioSubFilterSelect.value;
                audioSubFilterSelect.classList.toggle("has-value", Boolean(state.audioSubFilter));
                applyFilters();
            });
        }

        function updateEpisodesFilterVisibility() {
            if (!episodesFilterSelect) {
                return;
            }
            if (state.typeFilter === "movie") {
                episodesFilterSelect.style.display = "none";
            } else {
                episodesFilterSelect.style.display = "";
            }
        }

        if (episodesFilterSelect) {
            episodesFilterSelect.addEventListener("change", () => {
                state.episodesFilter = episodesFilterSelect.value;
                episodesFilterSelect.classList.toggle("has-value", Boolean(state.episodesFilter));
                applyFilters();
            });
        }

        if (resetFiltersBtn) {
            resetFiltersBtn.addEventListener("click", resetAllFilters);
        }

        if (toggleGenresBtn && genresCollapsible) {
            const GENRES_COLLAPSED_KEY = "local_media_genres_collapsed_v1";
            const isInitialCollapsed = localStorage.getItem(GENRES_COLLAPSED_KEY) === "true";
            if (isInitialCollapsed) {
                genresCollapsible.classList.add("collapsed");
                if (genreToggleArrow) {
                    genreToggleArrow.textContent = "▸";
                }
            }

            toggleGenresBtn.addEventListener("click", () => {
                const nowCollapsed = genresCollapsible.classList.toggle("collapsed");
                if (genreToggleArrow) {
                    genreToggleArrow.textContent = nowCollapsed ? "▸" : "▾";
                }
                localStorage.setItem(GENRES_COLLAPSED_KEY, `${nowCollapsed}`);
            });
        }

        loadMoreBtn.addEventListener("click", () => {
            state.visibleCount += PAGE_BATCH_SIZE;
            renderMoviesGrid();
        });

        genreBadgesBar.addEventListener("click", (event) => {
            const badge = event.target.closest(".genre-filter-badge");
            if (!badge) {
                return;
            }

            const genre = badge.dataset.genre;
            if (genre === "__ALL__") {
                state.selectedGenres.clear();
                state.excludedGenres.clear();
                applyFilters();
                return;
            }

            if (state.selectedGenres.has(genre)) {
                state.selectedGenres.delete(genre);
                state.excludedGenres.add(genre);
                applyFilters();
                return;
            }

            if (state.excludedGenres.has(genre)) {
                state.excludedGenres.delete(genre);
                applyFilters();
                return;
            }

            state.selectedGenres.add(genre);
            applyFilters();
        });

        genreBadgesBar.addEventListener("contextmenu", (event) => {
            const badge = event.target.closest(".genre-filter-badge");
            if (!badge) {
                return;
            }

            const genre = badge.dataset.genre;
            if (genre === "__ALL__") {
                return;
            }

            event.preventDefault();
            state.selectedGenres.delete(genre);

            if (state.excludedGenres.has(genre)) {
                state.excludedGenres.delete(genre);
                applyFilters();
                return;
            }

            state.excludedGenres.add(genre);
            applyFilters();
        });

        moviesContainer.addEventListener("click", (event) => {
            const card = event.target.closest(".movie-card");
            if (!card) {
                return;
            }
            const index = Number(card.dataset.movieIndex);
            const selectedItem = state.filtered[index];
            if (!selectedItem) {
                return;
            }
            state.lastFocusedCardIndex = index;
            openIntermediateScreen(selectedItem);
        });

        moviesContainer.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                const card = event.target.closest(".movie-card");
                if (!card) {
                    return;
                }
                event.preventDefault();
                const index = Number(card.dataset.movieIndex);
                const selectedItem = state.filtered[index];
                if (!selectedItem) {
                    return;
                }
                state.lastFocusedCardIndex = index;
                openIntermediateScreen(selectedItem);
            }
        });

        function updateTheaterButtonsState(isTheater) {
            const theaterBtn = document.getElementById("theaterFullscreenBtn");
            if (theaterBtn) {
                theaterBtn.innerHTML = isTheater ? "↙ Свий екран" : "⛶ Цял екран";
                theaterBtn.title = isTheater ? "Свий плеъра (нормален размер)" : "Разпъни плеъра на цял екран";
            }
        }

        function exitPlayerFullscreen(box) {
            const targetBox = box || document.getElementById("mainPlayerFrameBox");
            if (targetBox) {
                targetBox.classList.remove("theater-mode");
                targetBox.classList.remove("is-fullscreen");
            }
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                try {
                    const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                    if (exitFn) {
                        exitFn.call(document).catch(() => {});
                    }
                } catch (e) {}
            }
            updateTheaterButtonsState(false);
        }

        function enterPlayerFullscreen(box) {
            if (!box) {
                return;
            }
            if (box.classList.contains("theater-mode") || box.classList.contains("is-fullscreen")) {
                exitPlayerFullscreen(box);
                return;
            }
            const req = box.requestFullscreen || box.webkitRequestFullscreen || box.mozRequestFullScreen || box.msRequestFullscreen;
            if (req) {
                try {
                    const promise = req.call(box);
                    if (promise && typeof promise.catch === "function") {
                        promise.then(() => {
                            box.classList.add("is-fullscreen");
                            updateTheaterButtonsState(true);
                        }).catch(() => {
                            box.classList.add("theater-mode");
                            updateTheaterButtonsState(true);
                        });
                    } else {
                        box.classList.add("is-fullscreen");
                        updateTheaterButtonsState(true);
                    }
                } catch (err) {
                    box.classList.add("theater-mode");
                    updateTheaterButtonsState(true);
                }
                return;
            }
            box.classList.add("theater-mode");
            updateTheaterButtonsState(true);
        }

        const fullscreenEvents = ["fullscreenchange", "webkitfullscreenchange", "mozfullscreenchange", "MSFullscreenChange"];
        for (const evt of fullscreenEvents) {
            document.addEventListener(evt, () => {
                const isFs = Boolean(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
                const box = document.getElementById("mainPlayerFrameBox");
                if (box) {
                    box.classList.toggle("is-fullscreen", isFs);
                    if (!isFs) {
                        box.classList.remove("theater-mode");
                    }
                }
                updateTheaterButtonsState(isFs || (box && box.classList.contains("theater-mode")));
            });
        }

        window.addEventListener("message", (event) => {
            if (!event.data) {
                return;
            }
            try {
                const dataStr = typeof event.data === "string" ? event.data : JSON.stringify(event.data);
                if (dataStr.includes("exitFullscreen") || dataStr.includes("exit_fullscreen")) {
                    exitPlayerFullscreen();
                }
            } catch (e) {}
        });

        modalBody.addEventListener("click", (event) => {
            const theaterBtn = event.target.closest("#theaterFullscreenBtn");
            if (theaterBtn) {
                const box = document.getElementById("mainPlayerFrameBox");
                if (box && box.classList.contains("theater-mode")) {
                    exitPlayerFullscreen(box);
                    return;
                }
                enterPlayerFullscreen(box);
                return;
            }

            const exitTheaterBtn = event.target.closest("#exitTheaterBtn");
            if (exitTheaterBtn) {
                exitPlayerFullscreen();
                return;
            }

            const expandBtn = event.target.closest(".modal-expand-btn");
            if (expandBtn) {
                if (expandBtn.id === "modalOverviewToggle") {
                    const textEl = modalBody.querySelector("#modalOverviewText");
                    if (textEl) {
                        const isClamped = textEl.classList.toggle("is-clamped");
                        expandBtn.textContent = isClamped ? "Виж още ▾" : "Свий ▴";
                    }
                    return;
                }
                const crewRow = expandBtn.closest(".modal-collapsible-crew");
                if (crewRow) {
                    const chipsEl = crewRow.querySelector(".modal-crew-chips");
                    if (chipsEl) {
                        const isClamped = chipsEl.classList.toggle("is-clamped");
                        expandBtn.textContent = isClamped ? "още ▾" : "свий ▴";
                    }
                    return;
                }
                const chipRow = expandBtn.closest(".modal-chips-row");
                if (chipRow) {
                    const listEl = chipRow.querySelector(".modal-collapsible-chips");
                    if (listEl) {
                        const isClamped = listEl.classList.toggle("is-clamped");
                        expandBtn.textContent = isClamped ? "още ▾" : "свий ▴";
                    }
                    return;
                }
            }

            const modalWatchBtn = event.target.closest("#modalWatchlistBtn");
            if (modalWatchBtn && state.activeModalItem) {
                const nowSaved = toggleWatchlistItem(state.activeModalItem);
                modalWatchBtn.classList.toggle("saved", nowSaved);
                modalWatchBtn.textContent = nowSaved ? "🔖 В списъка „За по-късно“" : "🔖 Добави в „За по-късно“";
                renderMoviesGrid();
                return;
            }

            const seasonBtn = event.target.closest(".season-btn");
            if (seasonBtn && state.activeModalItem) {
                state.activeSeasonIndex = Number(seasonBtn.dataset.seasonIdx);
                state.activeEpisodeIndex = 0;
                const mount = document.getElementById("modalPlayerMount");
                if (mount) {
                    mount.innerHTML = buildPlayerSectionMarkup(state.activeModalItem);
                }
                return;
            }

            const epBtn = event.target.closest(".episode-btn");
            if (epBtn && state.activeModalItem) {
                state.activeEpisodeIndex = Number(epBtn.dataset.episodeIdx);
                const mount = document.getElementById("modalPlayerMount");
                if (mount) {
                    mount.innerHTML = buildPlayerSectionMarkup(state.activeModalItem);
                }
                return;
            }

            const tabBtn = event.target.closest(".player-tab");
            if (!tabBtn || !tabBtn.dataset.embedUrl) {
                return;
            }
            const allTabs = modalBody.querySelectorAll(".player-tab");
            for (const tab of allTabs) {
                tab.classList.remove("active");
            }
            tabBtn.classList.add("active");
            const iframe = document.getElementById("modalPlayerIframe");
            if (iframe) {
                iframe.src = tabBtn.dataset.embedUrl;
            }
            const activeBadge = document.getElementById("activePlayerSummaryBadge");
            if (activeBadge) {
                activeBadge.textContent = tabBtn.textContent.trim();
            }
        });

        function checkAndClampModalContent() {
            const overviewText = modalBody.querySelector("#modalOverviewText");
            const overviewToggle = modalBody.querySelector("#modalOverviewToggle");
            if (overviewText && overviewToggle) {
                if (overviewText.scrollHeight > 30) {
                    overviewText.classList.add("is-clamped");
                    overviewToggle.style.display = "inline-flex";
                    overviewToggle.textContent = "Виж още ▾";
                }
            }

            const crewRows = modalBody.querySelectorAll(".modal-collapsible-crew");
            for (const row of crewRows) {
                const chipsEl = row.querySelector(".modal-crew-chips");
                const toggleBtn = row.querySelector(".crew-expand-btn");
                if (chipsEl && toggleBtn) {
                    if (chipsEl.scrollHeight > 34) {
                        chipsEl.classList.add("is-clamped");
                        toggleBtn.style.display = "inline-flex";
                        toggleBtn.textContent = "още ▾";
                    }
                }
            }

            const chipRows = modalBody.querySelectorAll(".modal-chips-row");
            for (const row of chipRows) {
                const listEl = row.querySelector(".modal-collapsible-chips");
                const toggleBtn = row.querySelector(".chip-expand-btn");
                if (listEl && toggleBtn) {
                    if (listEl.scrollHeight > 36) {
                        listEl.classList.add("is-clamped");
                        toggleBtn.style.display = "inline-flex";
                        toggleBtn.textContent = "още ▾";
                    }
                }
            }
        }

        window.addEventListener("resize", () => {
            if (movieModal.classList.contains("open")) {
                checkAndClampModalContent();
            }
        });

        const moviePageBackBtn = document.getElementById("moviePageBackBtn");
        if (moviePageBackBtn) {
            moviePageBackBtn.addEventListener("click", handleMovieBack);
        }
        if (closeModalBtn) {
            closeModalBtn.addEventListener("click", handleMovieBack);
        }

        if (intermediatePlayBtn) {
            intermediatePlayBtn.addEventListener("click", handleIntermediatePlay);
        }
        if (intermediateInfoBtn) {
            intermediateInfoBtn.addEventListener("click", handleIntermediateInfo);
        }
        if (intermediateBackBtn) {
            intermediateBackBtn.addEventListener("click", () => closeIntermediateScreen(false));
        }

        if (intermediateScreen) {
            intermediateScreen.addEventListener("keydown", (event) => {
                if (event.key === "ArrowRight") {
                    if (document.activeElement === intermediatePlayBtn && intermediateInfoBtn) {
                        event.preventDefault();
                        intermediateInfoBtn.focus();
                    }
                }
                if (event.key === "ArrowLeft") {
                    if (document.activeElement === intermediateInfoBtn && intermediatePlayBtn) {
                        event.preventDefault();
                        intermediatePlayBtn.focus();
                    }
                }
                if (event.key === "ArrowUp") {
                    if (document.activeElement === intermediatePlayBtn || document.activeElement === intermediateInfoBtn) {
                        if (intermediateBackBtn) {
                            event.preventDefault();
                            intermediateBackBtn.focus();
                        }
                    }
                }
                if (event.key === "ArrowDown") {
                    if (document.activeElement === intermediateBackBtn && intermediatePlayBtn) {
                        event.preventDefault();
                        intermediatePlayBtn.focus();
                    }
                }
            });
        }

        window.addEventListener("popstate", () => {
            if (window.location.hash.startsWith("#movie=")) {
                checkUrlMovieHash();
                return;
            }
            if (movieModal.classList.contains("open")) {
                closeMovieModal(true);
            }
            if (intermediateScreen && intermediateScreen.classList.contains("open")) {
                closeIntermediateScreen(true);
            }
        });

        document.addEventListener("keydown", (event) => {
            const isBackKey = event.key === "Escape" ||
                event.key === "GoBack" ||
                event.keyCode === 27 ||
                event.keyCode === 4 ||
                event.keyCode === 10009 ||
                event.keyCode === 461;

            if (isBackKey) {
                const box = document.getElementById("mainPlayerFrameBox");
                if (box && (box.classList.contains("theater-mode") || box.classList.contains("is-fullscreen") || document.fullscreenElement || document.webkitFullscreenElement)) {
                    event.preventDefault();
                    event.stopPropagation();
                    exitPlayerFullscreen(box);
                    return;
                }
                if (movieModal.classList.contains("open") || (intermediateScreen && intermediateScreen.classList.contains("open"))) {
                    event.preventDefault();
                    event.stopPropagation();
                    handleMovieBack();
                }
            }
        });

        modalBody.addEventListener("click", (event) => {
            const crewBtn = event.target.closest(".crew-search-btn");
            if (crewBtn) {
                const query = crewBtn.getAttribute("data-search-query");
                if (query) {
                    handleMovieBack();
                    searchInput.value = query;
                    state.searchQuery = query;
                    applyFilters();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                }
            }
        });

        const scrollTopBtn = document.getElementById("scrollTopBtn");
        if (scrollTopBtn) {
            window.addEventListener("scroll", () => {
                scrollTopBtn.classList.toggle("visible", window.scrollY > 350);
            }, { passive: true });
            scrollTopBtn.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }

        loadInitialData();
        checkUrlMovieHash();
    </script>
</body>
</html>
