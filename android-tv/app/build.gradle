plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pukanki.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.pukanki.tv"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Pure native Android WebView app - zero unnecessary dependencies
}
