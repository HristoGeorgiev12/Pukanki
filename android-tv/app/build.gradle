plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pukanki.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.pukanki.tv"
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("BUILD_VERSION_CODE") ?: "8")
        versionName "2.3.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("PUKANKI_KEYSTORE_PATH")
            def ksPass = System.getenv("PUKANKI_KEYSTORE_PASSWORD")
            if (ksPath && file(ksPath).exists() && ksPass) {
                storeFile file(ksPath)
                storeType 'PKCS12'
                storePassword ksPass
                keyAlias 'pukanki'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("PUKANKI_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-datasource:1.2.1'
}
